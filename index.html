/* ---------- scoring ---------- */
function isRight(q,a){a=a||{};
  if(q.type==="ab") return a.a===q.a.ans[0]&&a.b===q.b.ans[0];
  if(q.type==="ms") return (a.m||[]).length===2&&q.ans.every(v=>a.m.includes(v));
  if(q.type==="match"||q.type==="order") return q.ans.every((v,k)=>(a.m||[])[k]===v);
  if(q.type==="num") return q.ans.some(v=>numEq(a.m,v));
  return a.m===q.ans[0];
}
function wtotal(s){const v=[0,1,2].map(k=>+(s.rub||{})[k]||0); return v.every(Boolean)?v.reduce((a,b)=>a+b):"–";}

/* ---------- results page ---------- */
let filt="all";
function optList(o,yours){return `<ul class="ro">${o.opts.map((t,j)=>{const c=o.ans.includes(j), y=yours.includes(j);
  return `<li class="${c?"c":y?"y":""}"><span class="ltr">${L[j]}</span><span>${t}</span>${c?`<span class="k" style="color:var(--good)">✓ correct${y?" · your answer":""}</span>`:y?`<span class="k" style="color:var(--bad)">✗ your answer</span>`:""}</li>`}).join("")}</ul>`;}
function reviewQ(q,i){
  const a=st.ans[i]||{}, ok=isRight(q,a), isM=subjOf(T)==="math", fig=q.fig?`<div class="figbox">${q.fig}</div>`:"";
  let h=`<article class="rq ${ok?"":"wrong"}"><h3><span class="${ok?"ok":"no"}">${ok?"✓ Correct":"✗ Not correct"}</span> Question ${i+1} <span class="tag">${q.skill}</span><span style="color:var(--muted);font-size:13px">${isM?q.cat:q.p===0?"Both passages":"Passage "+q.p}</span></h3>`;
  if(q.type==="ab") h+=`<p>${q.a.stem}</p>${optList(q.a,[a.a])}<p>${q.b.stem}</p>${optList(q.b,[a.b])}`;
  else if(q.type==="num"){h+=`<p>${q.stem}</p>${fig}<p class="numres">Your answer: <b style="color:${ok?"var(--good)":"var(--bad)"}">${a.m&&String(a.m).trim()?esc(a.m):"—"}</b>${q.unit&&a.m?" "+q.unit:""} &nbsp;·&nbsp; Correct answer: <b>${esc(q.ans[0])}</b>${q.unit?" "+q.unit:""}${q.ans.length>1?` <span class="kl">(also accepted: ${q.ans.slice(1).map(esc).join(", ")})</span>`:""}</p>`;}
  else if(q.type==="match"){h+=`<p>${q.stem}</p>${fig}<table class="rub"><tr><th>Item</th><th>Your answer</th><th>Correct answer</th></tr>${q.rows.map((r,k)=>{const y=(a.m||[])[k];return `<tr><td>${r}</td><td style="color:${y===q.ans[k]?"var(--good)":"var(--bad)"}">${y!=null?q.cols[y]:"—"}</td><td><b>${q.cols[q.ans[k]]}</b></td></tr>`}).join("")}</table>`;}
  else if(q.type==="order"){h+=`<p>${q.stem}</p>${fig}<table class="rub"><tr><th>Event</th><th>Your number</th><th>Correct</th></tr>${q.items.map((r,k)=>{const y=(a.m||[])[k];return `<tr><td>${r}</td><td style="color:${y===q.ans[k]?"var(--good)":"var(--bad)"}">${y||"—"}</td><td><b>${q.ans[k]}</b></td></tr>`}).join("")}</table>`;}
  else{ if(q.quote) h+=`<blockquote>${q.quote}</blockquote>`; h+=`<p>${q.stem}</p>${fig}${optList(q,q.type==="ms"?(a.m||[]):[a.m])}`;}
  return h+`<div class="why"><b>Why:</b> ${q.why}</div></article>`;
}
function results(){
  showPlayer(false); view="results"; location.hash=T.id;
  const sc=scoreOf(T,st), pct=Math.round(sc/N*100), sk={}, isM=subjOf(T)==="math";
  T.q.forEach((q,i)=>{const k=isM?q.cat:q.skill; sk[k]=sk[k]||[0,0]; sk[k][1]++; if(isRight(q,st.ans[i])) sk[k][0]++;});
  const strong = isM?Math.ceil(N*0.8):T.level===1?12:13;
  const msg = sc>=strong?"Great work! You’re ready for a harder level.":sc>=Math.round(N*0.65)?"Good effort. Review the questions you missed below.":"Keep practicing. Read each explanation carefully, then try again.";
  const missed=T.q.filter((q,i)=>!isRight(q,st.ans[i])).length;
  $("repin").innerHTML=`
  <div class="sum"><div class="box"><div style="color:var(--muted);font:600 14px Lexend,sans-serif">${esc(S.students[sid].name)} · ${isM?"Math":"Reading"} score</div>
    <div class="big">${sc}<small> / ${N}</small></div><p class="msg">${msg}</p><p style="margin:0;color:var(--muted)">${pct}% correct · time ${fmt(st.t||0)} · <span class="lv lv${T.level}">${LV[T.level]}</span></p></div>
    <div class="box"><div style="font:600 14px Lexend,sans-serif;color:var(--muted);margin-bottom:6px">${isM?"Score by area":"Score by skill"}</div>
    ${Object.entries(sk).map(([k,[r,t]])=>`<div class="sk"><span>${k}</span><span class="bar2"><i style="width:${r/t*100}%"></i></span><span class="n">${r} / ${t}</span></div>`).join("")}</div></div>
  <div class="row" style="justify-content:space-between;align-items:center"><h2 style="font:600 22px Lexend,sans-serif;margin:8px 0">Answers and explanations</h2>
    <div class="filt"><button data-f="all" aria-pressed="${filt==="all"}">All ${N}</button><button data-f="missed" aria-pressed="${filt==="missed"}">Missed ${missed}</button></div></div>
  <div id="rqs">${T.q.map((q,i)=>(filt==="missed"&&isRight(q,st.ans[i]))?"":reviewQ(q,i)).join("")||`<p>No missed questions. Excellent!</p>`}</div>
  ${T.w?`  <h2 style="font:600 22px Lexend,sans-serif;margin:20px 0 8px">Writing: score it together</h2>
  <div class="box"><p style="margin-top:0"><b>${T.w.mode} prompt:</b> ${T.w.task}</p>
  <p>Read the essay together, then choose 1–4 for each area. Florida scores B.E.S.T. Writing out of 12.</p>
  <div class="scroll"><table class="rub"><thead><tr><th>Area</th><th>4</th><th>3</th><th>2</th><th>1</th><th>Score</th></tr></thead><tbody>${T.w.rub.map((r,k)=>`<tr><th>${r[0]}</th>${r[1].map(c=>`<td>${c}</td>`).join("")}<td><select data-r="${k}" aria-label="${r[0]} score"><option value="">–</option>${[4,3,2,1].map(v=>`<option ${st.rub[k]==v?"selected":""}>${v}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
  <p><b>Writing total: <span id="wt">${wtotal(st)}</span> / 12</b></p>
  <div class="essay">${st.essay.trim()?esc(st.essay):"(No essay was written.)"}</div></div>
`:""}
  <div class="row" style="margin-top:18px"><button class="btn" data-home>◀ All tests</button>${isOwner&&mode==="online"?`<button class="btn ghost" data-dash>Progress dashboard</button>`:""}<button class="btn ghost" data-look>Look back at the test</button><button class="btn ghost" data-retake>Retake this test</button></div>`;
  $("rep").scrollTop=0; showSave();
}
$("repin").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.f){filt=b.dataset.f; results();}
  else if(b.hasAttribute("data-home")) home();
  else if(b.hasAttribute("data-dash")) dash();
  else if(b.hasAttribute("data-look")) go(0);
  else if(b.hasAttribute("data-retake")){ if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Click again to erase answers";return;} S.prog[sid][T.id]=fresh(); saveFor(sid,T.id); open(T.id);}
});
$("repin").addEventListener("change",e=>{const s=e.target.closest("select"); if(!s) return; st.rub[s.dataset.r]=s.value; save(); $("wt").textContent=wtotal(st);});

paintThemeButtons();
const h0=location.hash.slice(1);
if(h0==="dashboard") home(); else if(TESTS.some(t=>t.id===h0)&&ensureStudent()){open(h0); if(st.done) results();} else home();
}

</script>
