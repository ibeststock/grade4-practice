<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 4 Practice Tests</title>
<meta name="robots" content="noindex">
<script>try{const t=localStorage.getItem("g4theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, clear computer-based test player for a 9-year-old
   IDEA: an online state test: a test menu, then split passage / question panes with tools
   PICTURE: the working test itself
   COLOUR and TYPE: white panes on deep teal; level colours green / amber / violet; Atkinson Hyperlegible + Lexend
   LAYOUT: menu of six test cards; player = toolbar, navigator, two panes, footer; results = report page */
:root{color-scheme:light dark;
--frame:light-dark(#0f4c52,#0b2a2e);--frame2:light-dark(#16626a,#123a3f);
--bg:light-dark(#e8efee,#0e1617);--paper:light-dark(#ffffff,#172224);--ink:light-dark(#18211f,#e7eeec);
--muted:light-dark(#5b6967,#9fb0ad);--line:light-dark(#cfdad8,#2c3b3d);--accent:light-dark(#0f766e,#5ad1c3);
--sel:light-dark(#d9f2ee,#123f3a);--flag:#e0892b;--good:light-dark(#1d7a3a,#6ad08a);--goodbg:light-dark(#e3f5e8,#14301d);
--bad:light-dark(#b42318,#ff8a80);--badbg:light-dark(#fdecea,#3a1a18);
--l1:#2f8f4e;--l2:#c27c0e;--l3:#7a4fc9;--fs:17px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.6 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
[hidden]{display:none!important}
/* menu */
.home{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,44px) max(4vw,14px)}
.home h1{font:600 clamp(26px,4vw,40px)/1.1 Lexend,sans-serif;margin:0 0 8px;text-wrap:balance}
.home .lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.lv{display:inline-flex;align-items:center;gap:6px;font:600 13px Lexend,sans-serif;padding:3px 12px;border-radius:20px;color:#fff;white-space:nowrap}
.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card .top1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .tn{font:600 14px Lexend,sans-serif;color:var(--muted)}
.card h2{font:600 21px/1.2 Lexend,sans-serif;margin:0}
.card .tp{margin:0;color:var(--muted);font-size:15px}
.card ul{margin:2px 0;padding:0;list-style:none;font-size:14.5px}
.card li{padding:3px 0;border-top:1px dashed var(--line)}
.card li b{font-weight:700}
.card .stat{font-size:14px;color:var(--muted);margin-top:auto}
.card .stat b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:10px;padding:8px 18px;min-height:44px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
/* player */
.app{height:100%;display:flex;flex-direction:column}
.top{background:var(--frame);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
.top h1{font:600 15px/1.2 Lexend,sans-serif;margin:0 auto 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool{background:var(--frame2);border:1px solid #ffffff33;border-radius:8px;padding:6px 12px;min-height:40px;color:#fff;font-size:14px}
.tool[aria-pressed=true]{background:#fff;color:var(--frame);font-weight:700}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #ffffff88;padding:0}
.sw[aria-pressed=true]{outline:3px solid #fff;outline-offset:2px}
.pal{display:flex;gap:6px;align-items:center;background:#ffffff1a;padding:4px 8px;border-radius:10px}
.timer{font:600 14px Lexend,sans-serif;font-variant-numeric:tabular-nums;padding:0 4px}
.nav{background:var(--frame2);display:flex;gap:6px;padding:8px 14px;overflow-x:auto}
.nav button{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #ffffff66;background:transparent;color:#fff;font:600 14px Lexend,sans-serif;position:relative}
.nav button.done{background:#ffffff2e}
.nav button.cur{background:#fff;color:var(--frame);border-color:#fff}
.nav button.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--flag);border:2px solid var(--frame2)}
.nav .w{width:auto;border-radius:20px;padding:0 14px}
.nav .rv{width:auto;border-radius:20px;padding:0 14px;margin-left:auto;background:#ffbf47;color:#222;border-color:#ffbf47}
main.split{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:12px;min-height:0}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:auto;position:relative}
.pin{padding:20px 28px 40px;max-width:72ch}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:8px 8px 0 0;padding:6px 14px;font-size:15px;min-height:40px}
.tabs button[aria-selected=true]{background:var(--paper);font-weight:700;color:var(--accent);margin-bottom:-1px}
.ptitle{font:600 26px/1.15 Lexend,sans-serif;margin:0 0 4px}
.psub{color:var(--muted);font-size:14px;margin:0 0 16px}
.pin h3{font:600 18px Lexend,sans-serif;margin:22px 0 6px;color:var(--accent)}
.pin p{margin:0 0 14px}
.pn{font:700 13px Lexend,sans-serif;color:var(--muted);margin-right:6px}
.pin table{border-collapse:collapse;width:100%;margin:18px 0 6px;font-size:.92em}
.pin caption{font:600 15px Lexend,sans-serif;text-align:left;padding-bottom:6px}
.pin th,.pin td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.pin th{background:var(--sel)}
.src{font-size:13px;color:var(--muted);font-style:italic}
.tip{border:2px solid var(--accent);border-radius:10px;padding:10px 16px;margin:16px 0}
.tip h4{margin:0 0 4px;font:600 15px Lexend,sans-serif}.tip ul{margin:0;padding-left:20px}
.stanza{margin:0 0 18px}
.pl{display:grid;grid-template-columns:2.4em 1fr;align-items:baseline}
.pl .lnum{font:600 12px Lexend,sans-serif;color:var(--muted);text-align:right;padding-right:10px}
.stz{font:600 12px Lexend,sans-serif;color:var(--accent);margin:0 0 2px 2.4em}
mark{color:inherit;border-radius:2px;padding:0 1px}
mark.c0{background:light-dark(#fff07a,#7a6a00)}mark.c1{background:light-dark(#b9f0b9,#1f5a2a)}
mark.c2{background:light-dark(#bfe3ff,#1d4a6e)}mark.c3{background:light-dark(#ffcfe6,#6b2a4a)}
body.hl .pin{cursor:text}body.er .pin mark{cursor:pointer;outline:1px dashed var(--bad)}
.rdwrap{position:fixed;overflow:hidden;pointer-events:none;z-index:5;display:none}
.reader{position:absolute;left:0;right:0;box-shadow:0 0 0 100vmax #000a;border-block:2px solid #ffbf47;transition:top .08s ease-out,height .08s ease-out}
@media(prefers-reduced-motion:reduce){.reader{transition:none}}
.qbox{padding:22px 26px 30px}
.qnum{font:600 14px Lexend,sans-serif;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{background:var(--sel);color:var(--accent);padding:2px 10px;border-radius:12px}
.stem{margin:0 0 12px}
blockquote{margin:0 0 14px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--sel);border-radius:0 8px 8px 0}
.opts{display:grid;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.opt{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.opt.on{border-color:var(--accent);background:var(--sel)}
.opt .pick{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;padding:10px 12px;min-height:48px}
.ltr{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:600 14px Lexend,sans-serif}
.ms .ltr{border-radius:6px}
.opt.on .ltr{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.opt.x .pick{text-decoration:line-through;color:var(--muted)}
.opt .strike{flex:none;width:48px;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);font-size:13px}
.opt.x .strike{color:var(--bad);font-weight:700}
.hint{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.mt{border-collapse:collapse;width:100%;margin:0 0 20px;font-size:.95em}
.mt th,.mt td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
.mt td:first-child,.mt th:first-child{text-align:left}
.mt th{background:var(--sel);font-size:14px}
.mt input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
.ord{display:grid;gap:8px;margin:0 0 20px}
.ord label{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 12px}
.ord select{font-size:16px;padding:6px;border-radius:8px;border:2px solid var(--line);background:var(--paper);min-width:64px}
.ord select.set{border-color:var(--accent)}
.foot{display:flex;gap:10px;padding:10px 14px;background:var(--paper);border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.flagbtn{margin:0 auto;background:none;border:2px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
.flagbtn[aria-pressed=true]{border-color:var(--flag);color:var(--flag);font-weight:700}
textarea{width:100%;min-height:340px;font:inherit;line-height:1.7;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.wc{font-size:14px;color:var(--muted);text-align:right;margin-top:4px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:0 0 14px}
summary{font-weight:700;cursor:pointer;min-height:32px}
.plan{display:grid;gap:8px;margin-top:8px}
.plan label{font-size:14px;font-weight:700}
.plan input{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.check{margin:0 0 14px;padding-left:20px;font-size:15px}
.overlay{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:16px}
.overlay.open{display:grid}
.modal{background:var(--paper);border-radius:14px;max-width:820px;width:100%;max-height:90vh;overflow:auto;padding:24px 28px}
.modal h2{font:600 24px Lexend,sans-serif;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0}
.grid button{border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--paper);text-align:left;min-height:56px;font-size:14px}
.grid .done{border-color:var(--accent)}.grid .fl{border-color:var(--flag)}
/* results */
.rep{flex:1;overflow:auto}
.repin{max-width:980px;margin:0 auto;padding:clamp(16px,3vw,32px) max(3vw,14px) 60px}
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-bottom:18px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.big{font:600 clamp(48px,8vw,72px)/1 Lexend,sans-serif;color:var(--accent)}
.big small{font-size:.4em;color:var(--muted)}
.msg{font-weight:700;margin:8px 0 2px}
.sk{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.2em;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.sk .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.filt{display:flex;gap:6px;margin:6px 0 12px}
.filt button{border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:4px 14px;min-height:40px;font-size:14px}
.filt button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:700}
.rq{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--good);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.rq.wrong{border-left-color:var(--bad)}
.rq h3{font:600 16px Lexend,sans-serif;margin:0 0 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rq .ok{color:var(--good)}.rq .no{color:var(--bad)}
.ro{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:4px}
.ro li{display:flex;gap:8px;padding:6px 10px;border-radius:8px;border:1px solid transparent;font-size:15.5px}
.ro li .ltr{width:24px;height:24px;font-size:12px}
.ro li.c{background:var(--goodbg);border-color:var(--good)}
.ro li.y{background:var(--badbg);border-color:var(--bad)}
.ro li .k{margin-left:auto;font:600 12px Lexend,sans-serif;white-space:nowrap;padding-left:8px}
.why{background:var(--sel);border-radius:8px;padding:8px 12px;font-size:15px}
.why b{color:var(--accent)}
.rub{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
.rub th,.rub td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.rub select{padding:4px;font-size:16px}
.essay{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font-size:15px}

.login h2{font:600 22px Lexend,sans-serif;margin:6px 0 14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:0 0 12px}
.name{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 12px;border:2px solid var(--line);border-radius:18px;background:var(--paper);font:600 20px Lexend,sans-serif;min-height:150px;justify-content:center}
.name:hover{border-color:var(--accent)}
.name .ini{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--paper);font-size:30px}
.name.add{border-style:dashed;color:var(--muted)}.name.add .ini{background:var(--bg);color:var(--muted)}
.pad{max-width:340px;margin:0 auto;text-align:center}
.pad h2{font:600 22px/1.25 Lexend,sans-serif;margin:0 0 6px}
.dots{display:flex;justify-content:center;gap:16px;margin:18px 0 6px}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}.dots span.on{background:var(--accent)}
.pinin{position:absolute;opacity:0;width:1px;height:1px}
#addF2 .pinin{position:static;opacity:1;width:100%;height:auto;font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.padmsg{min-height:1.5em;color:var(--bad);font-weight:700;margin:4px 0 10px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:60px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font:600 24px Lexend,sans-serif}
.key:active{background:var(--sel)}.key.sm{font-size:15px}
.subj{display:flex;gap:6px;margin:0 0 16px;border-bottom:2px solid var(--line)}
.subj button{border:0;background:none;padding:10px 18px;font:600 17px Lexend,sans-serif;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.subj button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.sech{font:600 22px Lexend,sans-serif;margin:22px 0 10px}
main.split.solo{grid-template-columns:minmax(0,1fr)}
main.split.solo #right{max-width:900px;width:100%;margin:0 auto}
.figbox{margin:4px 0 16px;overflow-x:auto}
.fig{max-width:100%;height:auto;display:block;color:var(--ink)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.dtab{border-collapse:collapse;margin:6px 0;font-size:.95em}
.dtab caption{font:600 15px Lexend,sans-serif;text-align:left;padding-bottom:6px}
.dtab th,.dtab td{border:1px solid var(--line);padding:6px 14px;text-align:left}
.dtab th{background:var(--sel)}
.dtab.sl td:last-child{letter-spacing:.35em}
.key{font-size:13px;color:var(--muted);margin:4px 0 0}
.numwrap{margin:6px 0 20px}
.numin{font:600 22px Lexend,sans-serif;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:12em;max-width:100%;min-height:52px}
.numin:focus{border-color:var(--accent);outline:none}
.unit{font-size:17px;color:var(--muted)}
.numres{background:var(--bg);border-radius:8px;padding:8px 12px}
.pickhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px}
.pickwrap{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:10px 0 30px}
.pickq{font:600 clamp(28px,4.5vw,44px)/1.1 Lexend,sans-serif;text-align:center;margin:0;text-wrap:balance}
.pick2{display:flex;gap:clamp(18px,4vw,44px);justify-content:center;flex-wrap:wrap;width:100%}
.subjbtn{position:relative;width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 24px 22px;border:0;border-radius:32px;color:#fff;
  box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 34px rgba(0,0,0,.16);transition:transform .15s ease,box-shadow .15s ease}
.subjbtn:hover,.subjbtn:focus-visible{transform:translateY(-6px) rotate(-1deg);box-shadow:0 16px 0 rgba(0,0,0,.16),0 26px 40px rgba(0,0,0,.2)}
.subjbtn.s-math:hover,.subjbtn.s-math:focus-visible{transform:translateY(-6px) rotate(1deg)}
.subjbtn:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.2)}
@media(prefers-reduced-motion:reduce){.subjbtn,.subjbtn:hover{transition:none;transform:none}}
.s-reading{background:linear-gradient(160deg,#18a093,#0b5d57)}
.s-math{background:linear-gradient(160deg,#8f5cf0,#5a2fb0)}
.sart{width:190px;height:auto;margin:4px 0 6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.stitle{font:600 30px/1.1 Lexend,sans-serif}
.sblurb{font-size:16px;opacity:.92}
.sprog{font:600 13.5px Lexend,sans-serif;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:14px;margin-top:6px}
.sgo{font:600 18px Lexend,sans-serif;background:#fff;color:#0b5d57;padding:10px 22px;border-radius:24px;margin-top:12px}
.s-math .sgo{color:#5a2fb0}
.lnk.back{font-size:15px;margin:0 0 6px;text-decoration:none}
.drills{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:0 0 8px}
.drhead h2{font:600 22px Lexend,sans-serif;margin:0}.drhead .kl{margin:2px 0 12px}
.drgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.drcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 14px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);min-height:150px}
.drcard:hover{border-color:#7a4fc9}
.drn{width:32px;height:32px;border-radius:50%;background:#7a4fc9;color:#fff;display:grid;place-items:center;font:600 15px Lexend,sans-serif}
.drt{font:600 16px/1.2 Lexend,sans-serif}.drd{font-size:13.5px;color:var(--muted)}.drs{margin-top:auto;font:600 12.5px Lexend,sans-serif;color:#7a4fc9}
:root[data-theme=dark] .drs{color:#b9a2ff}
.dtop{display:flex;justify-content:space-between;align-items:center}
.dwrap{max-width:820px;margin:0 auto}
.dtitle h1{font:600 clamp(24px,3.5vw,32px)/1.15 Lexend,sans-serif;margin:6px 0 10px}
.ddots{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.ddot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper);font:600 13px Lexend,sans-serif}

<script>
{
const TESTS = [{"id": "t1", "num": 1, "level": 1, "name": "Florida Wildlife Up Close", "topic": "Alligators, crocodiles and sea turtles", "p": [{"title": "Look-Alike Reptiles", "kind": "Informational", "structure": "Compare and contrast", "blocks": [["p", 1, "Imagine you are paddling a canoe down a quiet Florida river. Two dark eyes peek out of the water, and a long, scaly back floats nearby. Is it an alligator or a crocodile? Many people cannot tell the difference. These two reptiles look a lot alike, but if you know what to look for, you can tell them apart."], ["h", "How They Are Alike"], ["p", 2, "Alligators and crocodiles are both reptiles. Like all reptiles, they are cold-blooded, which means their bodies stay the same temperature as the air or water around them. That is why both animals spend hours resting in the sun. Both have thick, bumpy skin, powerful tails for swimming, and strong jaws filled with sharp teeth."], ["p", 3, "The two animals also raise their young in similar ways. A mother alligator and a mother crocodile each build a nest and lay eggs in it. Both mothers guard the nest from hungry raccoons. When the babies hatch, the mothers carry them gently to the water in their mouths."], ["h", "Telling Them Apart"], ["p", 4, "The easiest way to tell the two apart is to look at the snout. An alligator has a wide, rounded snout shaped like the letter U. A crocodile, on the other hand, has a long, pointed snout shaped like the letter V. When a crocodile closes its mouth, some of its bottom teeth still stick out. In contrast, an alligator’s bottom teeth are hidden when its mouth is shut."], ["p", 5, "Color is another clue. Alligators are usually dark, almost black. Crocodiles are lighter, often a grayish-green or tan color. The two reptiles also prefer different homes. Alligators live mostly in fresh water, such as lakes, ponds, and swamps. Crocodiles, however, can <b>tolerate</b> salt water. Special glands on their tongues remove extra salt from their bodies, so they can live comfortably along salty coasts and in mangrove swamps."], ["h", "A Special Place"], ["p", 6, "Florida is the only place in the world where alligators and crocodiles live side by side in the wild. Alligators are found all over the state, and there are more than a million of them. American crocodiles are much rarer. Only a few thousand live in Florida, mostly in the southern tip of the state. Crocodiles are also shyer than alligators and usually stay away from people."], ["p", 7, "Whether you spot a U-shaped snout or a V-shaped one, remember to keep your distance. Both animals are wild and should be watched only from far away. Still, learning their differences can turn a canoe trip into a fun reptile-spotting adventure."]]}, {"title": "Lights Out for Sea Turtles", "kind": "Informational", "structure": "Cause and effect", "blocks": [["p", 1, "On a warm summer night, the sand on a Florida beach begins to wiggle. One by one, tiny sea turtles push their way out of a nest. Each hatchling is small enough to fit in the palm of your hand. Right away, the babies have one important job: they must reach the ocean as quickly as they can."], ["h", "Following the Light"], ["p", 2, "How do hatchlings know which way to go? They follow the light. On a natural beach, the brightest place at night is the horizon over the ocean, where moonlight and starlight shine on the water. Because the sky over the sea is brighter than the dark sand dunes behind them, the hatchlings crawl toward the water. This clever trick has helped sea turtles survive for millions of years."], ["h", "When Lights Lead Turtles Astray"], ["p", 3, "Today, many beaches are lined with houses, hotels, and streetlights. These bright lights can be stronger than the glow of the moon. As a result, hatchlings become <b>disoriented</b>. They lose their sense of direction and crawl toward the buildings instead of the sea."], ["p", 4, "This mistake can be deadly. Hatchlings that crawl the wrong way may wander onto roads and parking lots. Others get tired and dry out in the hot morning sun. Because they spend so long on land, they are also easier for birds, crabs, and raccoons to catch. Many never make it to the ocean at all."], ["h", "Making a Difference"], ["p", 5, "Since bright lights are the cause of the problem, turning them off can help. Many Florida beach towns now ask people to turn off or cover outdoor lights during nesting season. Some homes and hotels use special “turtle-safe” lights. These lights are amber or red, sit low to the ground, and are covered so they do not shine on the beach. Residents can also close their curtains at night so indoor light stays inside."], ["p", 6, "These small changes make a big difference. When beaches stay dark, more hatchlings find their way to the water. Most of the sea turtle nests in the United States are laid on Florida’s beaches, so every light that is switched off really matters. With a little help from people, the next generation of sea turtles can have a bright future — by following a dark beach to the sea."], ["box", "Turtle-Safe Lighting Tips", ["Keep it <b>low</b>: mount lights close to the ground.", "Keep it <b>shielded</b>: cover lights so the bulb cannot be seen from the beach.", "Keep it <b>long</b>: use amber or red bulbs instead of bright white ones."]]]}], "q": [{"p": 1, "type": "mc", "skill": "Text structure", "why": "The passage shows how the reptiles are alike, then how they differ.", "stem": "How is the passage “Look-Alike Reptiles” mainly organized?", "opts": ["It tells events in the order they happened on a canoe trip.", "It compares and contrasts alligators and crocodiles.", "It describes a problem and explains how people solved it.", "It lists the steps for keeping safe around reptiles."], "ans": [1]}, {"p": 1, "type": "ms", "skill": "Text structure", "why": "“On the other hand” and “In contrast” signal differences. “Also” and “Both” signal sameness.", "stem": "Which words from paragraphs 4 and 5 signal that the author is showing a <b>difference</b>? <b>Select TWO answers.</b>", "opts": ["“on the other hand”", "“also”", "“In contrast”", "“Both”", "“another clue”"], "ans": [0, 2]}, {"p": 1, "type": "mc", "skill": "Context clues", "why": "Salt glands let crocodiles “live comfortably” in salty water.", "stem": "What does the word <b>tolerate</b> mean in this sentence?", "quote": "Crocodiles, however, can <b>tolerate</b> salt water. (paragraph 5)", "opts": ["to be afraid of", "to stay away from", "to be able to live with", "to search for"], "ans": [2]}, {"p": 1, "type": "ab", "skill": "Central idea", "why": "Paragraph 1 states the main point: alike, but you can tell them apart.", "a": {"stem": "<b>Part A:</b> What is the central idea of the passage?", "opts": ["Crocodiles are more dangerous than alligators.", "Alligators and crocodiles share many traits, but key differences help people tell them apart.", "Florida has more alligators than any other place in the world.", "Mother reptiles work hard to protect their eggs from raccoons."], "ans": [1]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“Imagine you are paddling a canoe down a quiet Florida river.” (paragraph 1)", "“These two reptiles look a lot alike, but if you know what to look for, you can tell them apart.” (paragraph 1)", "“Both mothers guard the nest from hungry raccoons.” (paragraph 3)", "“Crocodiles are also shyer than alligators and usually stay away from people.” (paragraph 6)"], "ans": [1]}}, {"p": 1, "type": "match", "skill": "Supporting details", "why": "Compare paragraphs 2–5.", "stem": "Decide whether each fact describes <b>alligators</b>, <b>crocodiles</b>, or <b>both</b>.", "cols": ["Alligators", "Crocodiles", "Both"], "rows": ["has a U-shaped snout", "is cold-blooded", "can live in salty water", "carries babies to the water in its mouth", "shows bottom teeth when its mouth is closed"], "ans": [0, 2, 1, 2, 1]}, {"p": 1, "type": "mc", "skill": "Text features", "why": "The heading previews the section on differences (paragraphs 4–5).", "stem": "Why does the author include the heading “Telling Them Apart” before paragraph 4?", "opts": ["to show readers that the next section explains the differences between the animals", "to warn readers that the animals are dangerous", "to tell readers where both animals live", "to show that the passage is ending"], "ans": [0]}, {"p": 1, "type": "mc", "skill": "Text structure", "why": "Paragraph 6 explains that Florida is the only place both live in the wild.", "stem": "What is the <b>most likely</b> reason the author includes paragraph 6?", "opts": ["to explain how crocodiles remove salt from their bodies", "to describe how mother reptiles build nests", "to show why Florida is a special place to see both animals", "to persuade readers to go on a canoe trip"], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "Signal words like “because,” “as a result,” and “since” show cause and effect.", "stem": "How is most of “Lights Out for Sea Turtles” organized?", "opts": ["It compares sea turtles with other ocean animals.", "It explains the steps a mother turtle takes to build a nest.", "It explains what causes hatchlings to get lost and the effects this has.", "It tells the life story of one sea turtle from birth to adulthood."], "ans": [2]}, {"p": 2, "type": "ab", "skill": "Cause and effect", "why": "Lights brighter than the moon pull hatchlings the wrong way.", "a": {"stem": "<b>Part A:</b> According to the passage, what is the main <b>cause</b> of hatchlings crawling the wrong way?", "opts": ["The sand dunes are too tall to climb.", "Bright lights from buildings shine more strongly than the moon.", "Birds and crabs chase them away from the water.", "The hatchlings come out during the hot morning."], "ans": [1]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“Each hatchling is small enough to fit in the palm of your hand.” (paragraph 1)", "“This clever trick has helped sea turtles survive for millions of years.” (paragraph 2)", "“These bright lights can be stronger than the glow of the moon.” (paragraph 3)", "“Others get tired and dry out in the hot morning sun.” (paragraph 4)"], "ans": [2]}}, {"p": 2, "type": "order", "skill": "Cause and effect", "why": "Lights shine (1) → disoriented (2) → crawl to buildings (3) → dry out or caught (4).", "stem": "These events form a cause-and-effect chain. Put them in order from <b>1</b> (first) to <b>4</b> (last).", "items": ["The hatchlings crawl toward the buildings instead of the sea.", "Lights from houses and hotels shine on the beach.", "The hatchlings dry out or are caught by predators.", "The hatchlings become disoriented."], "ans": [3, 1, 4, 2]}, {"p": 2, "type": "mc", "skill": "Context clues", "why": "The next sentence restates the meaning: they “lose their sense of direction.”", "stem": "Which words from paragraph 3 <b>best</b> help the reader understand the meaning of <b>disoriented</b>?", "quote": "As a result, hatchlings become <b>disoriented</b>. (paragraph 3)", "opts": ["“lined with houses, hotels, and streetlights”", "“stronger than the glow of the moon”", "“lose their sense of direction”", "“instead of the sea”"], "ans": [2]}, {"p": 2, "type": "ms", "skill": "Supporting details", "why": "Both are named in paragraph 5. The others are not in the passage.", "stem": "Which actions does the author describe as ways people can help hatchlings? <b>Select TWO answers.</b>", "opts": ["using amber or red lights that sit low to the ground", "shining flashlights on the sand to guide the turtles", "closing curtains at night", "carrying the hatchlings to the water", "building fences around the nests"], "ans": [0, 2]}, {"p": 2, "type": "mc", "skill": "Text features", "why": "The box sums up “low, shielded, long” in a short list.", "stem": "How does the “Turtle-Safe Lighting Tips” box at the end <b>mainly</b> help the reader?", "opts": ["It explains why sea turtles follow the light.", "It gives a quick, easy-to-remember list of ways to make lights safe for turtles.", "It tells how many sea turtle nests are on Florida beaches.", "It describes what hatchlings look like."], "ans": [1]}, {"p": 0, "type": "mc", "skill": "Comparing structures", "why": "Passage 1 = compare/contrast; Passage 2 = cause/effect.", "stem": "How is the structure of Passage 2 <b>different</b> from the structure of Passage 1?", "opts": ["Passage 1 explains causes and effects, but Passage 2 compares two animals.", "Passage 1 compares two animals, but Passage 2 explains causes and effects.", "Passage 1 tells events in time order, but Passage 2 gives steps to follow.", "Both passages are organized in exactly the same way."], "ans": [1]}, {"p": 0, "type": "mc", "skill": "Text features", "why": "Both use headings. Only Passage 2 describes a problem people caused.", "stem": "Which statement is true about <b>both</b> passages?", "opts": ["Both use headings to divide the information into sections.", "Both explain a problem that people caused.", "Both tell a story in the order events happened.", "Both compare two kinds of animals."], "ans": [0]}], "w": {"mode": "Expository", "intro": "Florida is home to amazing wild animals. Knowing how these animals live can help keep both people and animals safe.", "task": "Write an essay that explains how learning about Florida’s wild animals helps keep people and animals safe. Use information from <b>both</b> passages.", "check": ["State your central idea clearly in the introduction.", "Explain at least <b>two</b> main points.", "Support each point with facts and details from the passages and name the passage.", "Explain each detail in your own words. Don’t just copy sentences.", "Use transition words such as <i>first, next, also, because, as a result,</i> and <i>finally</i>.", "Write a conclusion that sums up your central idea.", "Check your spelling, capital letters, and punctuation."], "plan": ["Central idea (what your essay will explain)", "Main point 1", "Main point 2", "Main point 3 (optional)", "Conclusion"], "rub": [["Purpose / Structure", ["Central idea is focused and kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear central idea. Has an intro, body, and conclusion. Some transitions.", "Central idea is unclear or drifts. Weak intro or conclusion.", "No clear central idea or organization."]], ["Development", ["2–3 main points, each explained with facts from both passages. Passages are named.", "Points are supported, but some explanation is thin. Facts may come mostly from one passage.", "Few facts, or facts are copied without explaining them.", "Little or no information from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t2", "num": 2, "level": 2, "name": "Protecting the Everglades", "topic": "Marjory Stoneman Douglas and Burmese pythons", "p": [{"title": "Guardian of the Glades", "blocks": [["p", 1, "In the early 1900s, many people looked at the Everglades and saw nothing but a useless swamp. Builders dreamed of draining the water away so they could plant farms and build towns. One woman looked at the very same land and saw something else entirely: a living river. Her name was Marjory Stoneman Douglas, and she spent most of her remarkably long life defending it."], ["h", "Early Years"], ["p", 2, "Marjory Stoneman was born in Minneapolis, Minnesota, in 1890. As a girl, she loved books and writing. Later, at Wellesley College in Massachusetts, she earned top grades, and her classmates chose her to be their “Class Orator,” the student who gives speeches for the class. It was an early clue to the powerful voice she would one day use."], ["p", 3, "In 1915, she moved to Miami, Florida, to work for her father’s newspaper. At that time, Miami was a small city of only about 10,000 people. Douglas wrote news articles and, later, short stories for magazines. Little by little, her work taught her about the wild, watery land at the southern tip of Florida."], ["h", "A New Way of Seeing"], ["p", 4, "In the early 1940s, a book editor asked Douglas to write about the Miami River. She had a different idea. She asked to write about the Everglades instead. For the next five years, she talked with scientists, studied maps, and learned how water moved across the land. What she discovered surprised her. The Everglades was not a <b>stagnant</b> swamp. Instead, it was an extremely wide, extremely shallow river that crept slowly south through miles of sawgrass toward the sea."], ["p", 5, "In 1947, Douglas published her book, <i>The Everglades: River of Grass</i>. The title gave readers a whole new picture of the land. Her very first sentence was bold and simple: “There are no other Everglades in the world.” The first printing sold out in about a month. Just weeks after the book appeared, Everglades National Park was dedicated, protecting a large part of the region."], ["h", "A Fight She Would Not Quit"], ["p", 6, "Douglas could have stopped there, but she did not. In the late 1960s, planners wanted to build an enormous airport, called a jetport, in the Everglades. In 1969, at age 79, when most people have long since retired, Douglas started a group called Friends of the Everglades. She traveled around the state giving fiery speeches, usually wearing her wide straw hat and dark glasses. The group helped stop the jetport from being built."], ["p", 7, "For almost thirty more years, she kept speaking out. In 1993, President Bill Clinton awarded her the Presidential Medal of Freedom, one of the highest honors an American can receive. She died in 1998 at the age of 108. Today, a huge wilderness area inside Everglades National Park carries her name, a fitting <b>tribute</b> to the woman who taught the world to see the river in the grass."], ["table", "Timeline: The Life of Marjory Stoneman Douglas", ["Year", "Event"], [["1890", "Born in Minneapolis, Minnesota"], ["1915", "Moves to Miami to work for a newspaper"], ["Early 1940s", "Begins researching the Everglades"], ["1947", "Publishes <i>The Everglades: River of Grass</i>; Everglades National Park is dedicated"], ["1969", "Founds Friends of the Everglades"], ["1993", "Receives the Presidential Medal of Freedom"], ["1998", "Dies at age 108"]], null]], "kind": "Informational", "structure": "Chronological (time order)"}, {"title": "Snakes in the River of Grass", "blocks": [["p", 1, "The Everglades is home to alligators, wading birds, otters, and deer. In recent years, however, an unwelcome visitor has slithered into the river of grass. It is the Burmese python, and it has become one of the biggest threats the Everglades has ever faced."], ["h", "How the Problem Began"], ["p", 2, "Burmese pythons are native to Southeast Asia, thousands of miles from Florida. They can grow longer than 15 feet. For years, people bought baby pythons as pets. But when the snakes grew too large to handle, some owners released them into the wild. Others escaped. By 2000, scientists had confirmed that pythons were breeding in Everglades National Park. Today, tens of thousands of them may live in South Florida."], ["h", "A Growing Threat"], ["p", 3, "In their native home, pythons have predators and competitors that keep their numbers in check. In Florida, they have few natural enemies. The warm, wet climate suits them perfectly, and a single female can lay dozens of eggs at once. With plenty of food and little danger, the python population has exploded."], ["p", 4, "Pythons are not picky eaters. They swallow raccoons, rabbits, birds, deer, and even alligators. As the number of pythons grew, the number of many native animals dropped sharply. Scientists who drove park roads at night in the 2000s spotted far fewer mammals than scientists had seen in the 1990s. When animals like these disappear, the whole food web is thrown off balance."], ["table", "Drop in Mammal Sightings in Everglades National Park", ["Animal", "How much sightings dropped"], [["Raccoons", "99.3% fewer"], ["Opossums", "98.9% fewer"], ["Bobcats", "87.5% fewer"], ["Marsh rabbits", "None seen at all"]], "Source: a 2012 study reported by the U.S. Geological Survey"], ["h", "Searching for Solutions"], ["p", 5, "Removing pythons is extremely difficult. Their brown and tan blotches blend into the grass, and they hide in places few people can reach. Even trained experts can walk right past one without noticing. Because no single solution can fix the problem, Florida is fighting back in several ways at once."], ["p", 6, "First, the state pays trained hunters to search for and remove pythons. Every summer, it also holds the Florida Python Challenge, a contest in which members of the public compete to catch as many pythons as they can."], ["p", 7, "Second, scientists are getting creative. Specially trained dogs sniff out pythons hiding in thick brush. Researchers also attach radio trackers to some male pythons, nicknamed “scout snakes.” During breeding season, these males lead scientists straight to large females, which can be removed before they lay their eggs."], ["p", 8, "Third, Florida is working to stop new pythons from entering the wild. State rules now make it illegal for people to get Burmese pythons as new pets. Officials also remind pet owners never to release any animal outdoors."], ["p", 9, "None of these solutions will remove every python. Together, however, they slow the snakes’ spread and protect the places that matter most. The fight to protect the Everglades did not end with Marjory Stoneman Douglas. Today, a new generation of hunters, scientists, and ordinary citizens is carrying it on."]], "kind": "Informational", "structure": "Problem and solution"}], "q": [{"p": 1, "type": "mc", "skill": "Text structure", "why": "Headings and dates move from 1890 to 1998 in time order.", "stem": "How is most of “Guardian of the Glades” organized?", "opts": ["It compares Douglas’s life in Minnesota with her life in Florida.", "It describes the problem of the jetport and explains how it was solved.", "It describes events in Douglas’s life in the order they happened.", "It explains the causes and effects of draining the Everglades."], "ans": [2]}, {"p": 1, "type": "mc", "skill": "Text structure", "why": "The opening sets up a contrast: others saw a swamp, Douglas saw a river.", "stem": "Why does the author <b>most likely</b> begin the passage by describing how “many people” saw the Everglades?", "opts": ["to show how different Douglas’s view of the Everglades was from the views of others", "to explain why builders wanted to live in Florida", "to describe how the Everglades was drained in the early 1900s", "to prove that the Everglades really was a useless swamp"], "ans": [0]}, {"p": 1, "type": "mc", "skill": "Context clues", "why": "“Instead” signals the opposite of a river that “crept slowly,” so stagnant means not moving.", "stem": "Based on the sentences around it, what does <b>stagnant</b> mean?", "quote": "The Everglades was not a <b>stagnant</b> swamp. (paragraph 4)", "opts": ["deep and dangerous", "still and not flowing", "covered in tall grass", "filled with salty water"], "ans": [1]}, {"p": 1, "type": "mc", "skill": "Figurative language", "why": "The metaphor describes shallow water flowing through sawgrass (paragraph 4).", "stem": "Douglas called the Everglades a “river of grass.” Why does this phrase fit the Everglades?", "opts": ["Tall grass grows along the banks of many rivers there.", "The Everglades is made up of many small rivers.", "The land is so dry that only grass can grow.", "A wide sheet of shallow water slowly flows through sawgrass."], "ans": [3]}, {"p": 1, "type": "ab", "skill": "Author’s perspective", "why": "“Could have stopped there, but she did not” and “fitting tribute” show admiration.", "a": {"stem": "<b>Part A:</b> Which statement <b>best</b> describes the author’s point of view about Marjory Stoneman Douglas?", "quote": null, "opts": ["The author thinks Douglas should have written about the Miami River.", "The author believes Douglas was lucky to become famous.", "The author admires Douglas for never giving up on the Everglades.", "The author thinks Douglas worked too hard at an old age."], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "quote": null, "opts": ["“Marjory Stoneman was born in Minneapolis, Minnesota, in 1890.” (paragraph 2)", "“She had a different idea.” (paragraph 4)", "“At that time, Miami was a small city of only about 10,000 people.” (paragraph 3)", "“Douglas could have stopped there, but she did not.” (paragraph 6)"], "ans": [3]}}, {"p": 1, "type": "mc", "skill": "Text features", "why": "1947 − 1890 = 57. Uses the timeline plus subtraction.", "stem": "Use the passage and the timeline. How old was Douglas when <i>The Everglades: River of Grass</i> was published?", "opts": ["47", "57", "79", "108"], "ans": [1]}, {"p": 1, "type": "ms", "skill": "Supporting details", "why": "Both show her working for the Everglades late in life.", "stem": "Which details <b>best</b> show that Douglas stayed determined for her whole life? <b>Select TWO answers.</b>", "opts": ["She was born in Minneapolis, Minnesota, in 1890.", "At age 79, she started a group called Friends of the Everglades.", "The first printing of her book sold out in about a month.", "For almost thirty more years, she kept speaking out.", "Miami was a small city when she moved there."], "ans": [1, 3]}, {"p": 1, "type": "mc", "skill": "Summarize", "why": "She did not retire (B). C and D add details the text doesn’t say.", "stem": "Which sentence <b>best</b> summarizes paragraphs 6 and 7?", "opts": ["Even late in life, Douglas kept fighting for the Everglades and was honored for her work.", "Douglas helped stop the jetport and then retired from her work.", "President Clinton visited the Everglades with Douglas in 1993.", "A wilderness area was named after Douglas because she lived to be 108."], "ans": [0]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "C is a trap: effects are only one part of the passage.", "stem": "Which statement <b>best</b> describes how “Snakes in the River of Grass” is organized?", "opts": ["It compares Burmese pythons with alligators.", "It tells about one python hunter’s day from morning to night.", "It only explains the effects pythons have had on mammals.", "It describes a problem, explains how it grew, and then describes ways people are trying to solve it."], "ans": [3]}, {"p": 2, "type": "ab", "skill": "Supporting details", "why": "Paragraph 3 gives the reasons: few enemies, a good climate, many eggs.", "a": {"stem": "<b>Part A:</b> According to the passage, why did the python population grow so quickly in Florida?", "quote": null, "opts": ["Pythons eat only raccoons, which are easy to catch.", "Pythons have few natural enemies, and the climate suits them.", "Hunters stopped searching for pythons in the early 2000s.", "Pet stores in Florida still sell thousands of pythons each year."], "ans": [1]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "quote": null, "opts": ["“They can grow longer than 15 feet.” (paragraph 2)", "“Others escaped.” (paragraph 2)", "“In Florida, they have few natural enemies.” (paragraph 3)", "“Even trained experts can walk right past one without noticing.” (paragraph 5)"], "ans": [2]}}, {"p": 2, "type": "mc", "skill": "Text features", "why": "87.5% is a smaller drop than 99.3% or 98.9%. A and D go beyond the data.", "stem": "Which conclusion is <b>best</b> supported by the table “Drop in Mammal Sightings”?", "opts": ["Pythons have eaten every bobcat in Florida.", "Raccoons are the only animals that pythons eat.", "Bobcat sightings dropped less than raccoon and opossum sightings.", "Marsh rabbits moved to a safer part of the park."], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "Paragraph 5 says the snakes are hard to find, so several solutions are needed.", "stem": "How does paragraph 5 fit into the structure of the passage?", "opts": ["It explains why catching pythons has become a popular sport.", "It moves the passage from the problem to the solutions by explaining why several solutions are needed.", "It describes what pythons look like so readers can draw them.", "It gives the conclusion of the passage."], "ans": [1]}, {"p": 2, "type": "mc", "skill": "Supporting details", "why": "Paragraph 7 says the males lead scientists to the females.", "stem": "Why are “scout snakes” useful to scientists?", "opts": ["They hunt and eat other pythons.", "They warn hikers when pythons are nearby.", "They are easier to catch than female pythons.", "They lead scientists to female pythons before the females lay eggs."], "ans": [3]}, {"p": 2, "type": "ms", "skill": "Supporting details", "why": "Paragraph 8 covers prevention. A, B and D remove pythons already in the wild.", "stem": "Some solutions <b>remove</b> pythons that are already in the wild. Others <b>prevent</b> new pythons from getting into the wild. Which solutions are meant to <b>prevent</b> new pythons? <b>Select TWO answers.</b>", "opts": ["paying trained hunters to search for pythons", "holding the Florida Python Challenge", "making it illegal to get Burmese pythons as new pets", "using trained dogs to sniff out pythons", "reminding pet owners never to release animals outdoors"], "ans": [2, 4]}, {"p": 0, "type": "mc", "skill": "Comparing structures", "why": "Passage 1 = chronological; Passage 2 = problem and solution.", "stem": "How is the structure of Passage 1 <b>different</b> from the structure of Passage 2?", "opts": ["Both passages tell events in time order.", "Passage 1 tells events in time order, but Passage 2 describes a problem and its solutions.", "Passage 1 describes a problem and its solutions, but Passage 2 tells events in time order.", "Passage 1 compares two people, but Passage 2 explains causes and effects."], "ans": [1]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "A is a trap: Douglas never hunted pythons.", "stem": "Paragraph 9 of Passage 2 says, “The fight to protect the Everglades did not end with Marjory Stoneman Douglas.” How does this sentence connect the two passages?", "opts": ["It shows that Douglas helped catch the first pythons in Florida.", "It explains that pythons arrived because of the jetport.", "It shows that people today are continuing the work Douglas started.", "It suggests that Douglas’s book explained how to remove pythons."], "ans": [2]}], "w": {"mode": "Argumentative", "intro": "Protecting the Everglades takes a lot of time, money, and hard work. Some people think Florida should keep working hard to protect it. Others think that money and effort should go to other things.", "task": "Write an argumentative essay about whether Florida should keep working to protect the Everglades. Use information from <b>both</b> passages to support your claim.", "check": ["State your claim (your opinion) clearly in the introduction.", "Give at least <b>two</b> reasons for your claim.", "Support each reason with evidence from the passages and name the passage.", "Explain how each piece of evidence supports your claim.", "Use transition words such as <i>first, in addition, for example, as a result, however,</i> and <i>in conclusion</i>.", "Write a conclusion that restates your claim.", "Check your spelling, capital letters, and punctuation."], "plan": ["Claim", "Reason 1", "Reason 2", "Reason 3 (optional)", "Other side: what someone who disagrees might say, and why they are wrong", "Conclusion"], "rub": [["Purpose / Structure", ["Clear claim kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear claim. Has an intro, body, and conclusion. Some transitions.", "Claim is unclear or drifts. Weak intro or conclusion.", "No clear claim or organization."]], ["Development", ["2–3 reasons, each with evidence from both passages that is clearly explained. Passages are named.", "Reasons are supported, but some explanation is thin. Evidence may come mostly from one passage.", "Little evidence, or evidence is copied without explaining it.", "Little or no evidence from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t3", "num": 3, "level": 1, "name": "Florida’s Gentle Giants", "topic": "Manatees and how people rescue them", "p": [{"title": "Meet the Manatee", "kind": "Informational", "structure": "Description", "blocks": [["p", 1, "If you visit a Florida spring on a chilly winter morning, you might spot large gray shapes resting under the clear water. These gentle giants are Florida manatees. They are Florida’s official state marine mammal, and they are one of the most unusual animals in the water."], ["h", "A Big, Gentle Body"], ["p", 2, "An adult manatee is usually 8 to 10 feet long and weighs 800 to 1,200 pounds. Its thick, wrinkled skin is gray or brown. A manatee has two front flippers and a wide, flat tail shaped like a paddle. To swim, it moves its tail up and down. Manatees have tiny eyes and no outer ears, but scientists believe they can see and hear quite well."], ["h", "What Manatees Eat"], ["p", 3, "Manatees are <b>herbivores</b>, which means they eat only plants. Because they graze on underwater grasses the way cows graze in a field, people sometimes call them “sea cows.” A manatee can spend up to eight hours a day eating. It uses its strong, bendable upper lip to pull plants into its mouth. A large manatee may eat 40 to 90 pounds of seagrass and other plants in a single day!"], ["h", "Staying Warm"], ["p", 4, "Even though manatees are big, they do not have a thick layer of fat to keep them warm. Water colder than 68°F can make them sick. That is why, in winter, manatees travel to warmer places. Some gather at natural springs, where the water stays about 72°F all year long. Others crowd into the warm water that flows out of power plants."], ["h", "A Breath of Fresh Air"], ["p", 5, "Manatees are mammals, so they must breathe air, just like people. A manatee rises to the surface and pokes the top of its snout above the water to breathe through its nostrils. When it dives back down, flaps of skin close its nostrils so water cannot get in."], ["p", 6, "The manatee’s closest living relative may surprise you: it is the elephant! Both animals are large, slow-moving plant eaters with thick skin. Today, manatees are protected by law. People are not allowed to feed, chase, or bother them, so these gentle giants can live safely in Florida’s waters."], ["table", "Manatee Fact File", ["Fact", "Details"], [["Length", "8 to 10 feet"], ["Weight", "800 to 1,200 pounds"], ["Food", "Seagrass and other water plants"], ["Safe water temperature", "68°F or warmer"], ["Closest relative", "Elephant"]], null]]}, {"title": "A Manatee Rescue, Step by Step", "kind": "Informational", "structure": "Sequence (steps in order)", "blocks": [["p", 1, "One cold January morning, a kayaker paddling near Tampa Bay noticed something wrong. A manatee was floating at the surface, barely moving, with pale patches on its skin. The kayaker knew these could be signs that the manatee was sick from the cold. She also knew exactly what to do."], ["h", "Step 1: Report It"], ["p", 2, "First, the kayaker called the Florida Fish and Wildlife Conservation Commission’s Wildlife Alert hotline. She told them where the manatee was and described what she saw. She did not try to touch, push, or feed the manatee. Only trained experts should handle a sick or injured manatee."], ["h", "Step 2: The Team Arrives"], ["p", 3, "Next, a rescue team of trained biologists arrived by boat. They gently guided the manatee into a large, soft net. Lifting a manatee is no easy job. An adult can weigh more than 1,000 pounds, so it took about a dozen people to slide the manatee onto a padded stretcher."], ["h", "Step 3: The Trip to the Hospital"], ["p", 4, "Then, the team placed the manatee on foam pads in the back of a truck. During the drive, they sprayed its skin with water to keep it from drying out. Their destination was a manatee critical care center, a special animal hospital at ZooTampa at Lowry Park."], ["h", "Step 4: Getting Better"], ["p", 5, "At the hospital, veterinarians checked the manatee and placed it in a pool of warm water. They gave it medicine and fed it plenty of lettuce and other greens. Manatees may stay in <b>rehabilitation</b> for weeks or even months, until they are strong and healthy again."], ["h", "Step 5: Going Home"], ["p", 6, "Finally, when the manatee was healthy, the team returned it to the wild. Some released manatees wear a special belt around the tail that holds a tracking tag. The tag lets scientists follow the manatee and make sure it is doing well."], ["p", 7, "The whole rescue began with one person who noticed a problem and made a phone call. Thanks to her quick thinking, one more manatee is swimming free."], ["box", "If You See a Manatee in Trouble", ["Stay back. Do not touch, feed, or push it.", "Note where it is and what you see.", "Call the FWC Wildlife Alert hotline: 1-888-404-3922."]]]}], "q": [{"p": 1, "type": "mc", "skill": "Text structure", "why": "Each section describes a different feature of manatees: body, food, warmth, breathing.", "stem": "How is “Meet the Manatee” <b>mainly</b> organized?", "opts": ["It tells about events in a manatee’s life in time order.", "It describes different features of manatees, one topic at a time.", "It describes a problem and explains how people solved it.", "It compares manatees with cows."], "ans": [1]}, {"p": 1, "type": "mc", "skill": "Text features", "why": "That section explains that cold water makes manatees sick, so they move to springs.", "stem": "Which question does the section “Staying Warm” answer?", "opts": ["Why do manatees gather at springs in the winter?", "What do manatees eat each day?", "How do manatees breathe underwater?", "How long can a manatee grow?"], "ans": [0]}, {"p": 1, "type": "mc", "skill": "Context clues", "why": "The definition comes right after the word: “which means they eat only plants.”", "stem": "What does the word <b>herbivores</b> mean in paragraph 3?", "opts": ["animals that move slowly", "animals that live in water", "animals that eat only plants", "animals that live in groups"], "ans": [2]}, {"p": 1, "type": "match", "skill": "Text structure", "why": "Each fact belongs to the section whose heading describes it.", "stem": "Under which heading would you find each fact? Mark one heading for each fact.", "cols": ["A Big, Gentle Body", "What Manatees Eat", "Staying Warm"], "rows": ["has no outer ears", "may eat 40 to 90 pounds of plants a day", "travels to springs in winter", "moves its tail up and down to swim"], "ans": [0, 1, 2, 0]}, {"p": 1, "type": "ab", "skill": "Central idea", "why": "The passage describes the many ways manatees are unusual.", "a": {"stem": "<b>Part A:</b> What is the central idea of “Meet the Manatee”?", "opts": ["Manatees are dangerous animals that people should avoid.", "Manatees are unusual animals with special features that help them live in Florida’s waters.", "Manatees eat more food than any other animal in Florida.", "Manatees and elephants live in the same places."], "ans": [1]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“Others crowd into the warm water that flows out of power plants.” (paragraph 4)", "“Its thick, wrinkled skin is gray or brown.” (paragraph 2)", "“A manatee can spend up to eight hours a day eating.” (paragraph 3)", "“They are Florida’s official state marine mammal, and they are one of the most unusual animals in the water.” (paragraph 1)"], "ans": [3]}}, {"p": 1, "type": "ms", "skill": "Supporting details", "why": "Little fat plus danger from water below 68°F explains the need for warmth.", "stem": "Which details explain why manatees need warm water? <b>Select TWO answers.</b>", "opts": ["They do not have a thick layer of fat.", "They have tiny eyes and no outer ears.", "Water colder than 68°F can make them sick.", "They spend up to eight hours a day eating.", "Their closest relative is the elephant."], "ans": [0, 2]}, {"p": 1, "type": "mc", "skill": "Text features", "why": "The Fact File lists 68°F or warmer as the safe water temperature.", "stem": "Use the Manatee Fact File. Which water temperature would be <b>safe</b> for a manatee?", "opts": ["50°F", "60°F", "65°F", "72°F"], "ans": [3]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "Headings say Step 1 to Step 5, and words like first, next, then and finally show order.", "stem": "How is “A Manatee Rescue, Step by Step” organized?", "opts": ["It compares two different manatee rescues.", "It describes what manatees look like.", "It explains the causes of cold weather in Florida.", "It describes the steps of a rescue in the order they happened."], "ans": [3]}, {"p": 2, "type": "order", "skill": "Sequence", "why": "Call (1) → team arrives (2) → truck ride (3) → release (4).", "stem": "Put these events from the rescue in order from <b>1</b> (first) to <b>4</b> (last).", "items": ["The team drives the manatee to the hospital.", "The kayaker calls the hotline.", "The manatee is returned to the wild.", "The team slides the manatee onto a stretcher."], "ans": [3, 1, 4, 2]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "First, Next, Then, Finally are sequence signal words.", "stem": "Which group of words from the passage <b>best</b> signals the order of the steps?", "opts": ["cold, pale, sick", "First, Next, Then, Finally", "trained, gentle, padded", "January, morning, weeks"], "ans": [1]}, {"p": 2, "type": "mc", "skill": "Supporting details", "why": "Paragraph 3 says an adult can weigh more than 1,000 pounds.", "stem": "Why did it take about a dozen people to move the manatee?", "opts": ["An adult manatee can weigh more than 1,000 pounds.", "The stretcher was very heavy.", "The manatee was trying to swim away.", "The water was too cold for one person."], "ans": [0]}, {"p": 2, "type": "ab", "skill": "Inference", "why": "She knew only trained experts should handle a sick manatee.", "a": {"stem": "<b>Part A:</b> Why did the kayaker call for help instead of trying to help the manatee herself?", "opts": ["She was afraid of manatees.", "She did not have a phone.", "She knew trained experts should handle a sick manatee.", "She wanted to get the manatee on the news."], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“A manatee was floating at the surface, barely moving.” (paragraph 1)", "“Only trained experts should handle a sick or injured manatee.” (paragraph 2)", "“Next, a rescue team of trained biologists arrived by boat.” (paragraph 3)", "“The tag lets scientists follow the manatee.” (paragraph 6)"], "ans": [1]}}, {"p": 2, "type": "mc", "skill": "Context clues", "why": "The sentence says manatees stay there “until they are strong and healthy again.”", "stem": "What does <b>rehabilitation</b> mean in paragraph 5?", "quote": "Manatees may stay in <b>rehabilitation</b> for weeks or even months, until they are strong and healthy again. (paragraph 5)", "opts": ["a long trip in a truck", "a way to track animals", "a place where manatees are born", "a time of care to get healthy again"], "ans": [3]}, {"p": 0, "type": "mc", "skill": "Comparing structures", "why": "Passage 1 describes features; Passage 2 gives steps in order.", "stem": "How is the structure of Passage 1 <b>different</b> from the structure of Passage 2?", "opts": ["Passage 1 explains a problem, but Passage 2 compares two animals.", "Passage 1 tells steps in order, but Passage 2 describes features of manatees.", "Passage 1 describes features of manatees, but Passage 2 tells the steps of a rescue in order.", "Both passages are organized in the same way."], "ans": [2]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "Passage 1 says water below 68°F can make manatees sick; the rescue happened on a cold January morning.", "stem": "Which fact from Passage 1 <b>best</b> helps explain why the manatee in Passage 2 was sick?", "opts": ["Water colder than 68°F can make manatees sick.", "Manatees can spend up to eight hours a day eating.", "Manatees breathe through nostrils on top of the snout.", "The manatee’s closest relative is the elephant."], "ans": [0]}], "w": {"mode": "Expository", "intro": "Manatees are gentle animals, but sometimes they get sick or hurt and need help from people.", "task": "Write an essay that explains why manatees sometimes need help and how people help them. Use information from <b>both</b> passages.", "check": ["State your central idea clearly in the introduction.", "Explain at least <b>two</b> main points.", "Support each point with facts and details from the passages and name the passage.", "Explain each detail in your own words. Don’t just copy sentences.", "Use transition words such as <i>first, next, also, because, as a result,</i> and <i>finally</i>.", "Write a conclusion that sums up your central idea.", "Check your spelling, capital letters, and punctuation."], "plan": ["Central idea (what your essay will explain)", "Main point 1", "Main point 2", "Main point 3 (optional)", "Conclusion"], "rub": [["Purpose / Structure", ["Central idea is focused and kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear central idea. Has an intro, body, and conclusion. Some transitions.", "Central idea is unclear or drifts. Weak intro or conclusion.", "No clear central idea or organization."]], ["Development", ["2–3 main points, each explained with facts from both passages. Passages are named.", "Points are supported, but some explanation is thin. Facts may come mostly from one passage.", "Few facts, or facts are copied without explaining them.", "Little or no information from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t4", "num": 4, "level": 2, "name": "Treasures of the Reef", "topic": "Coral reef restoration and reefs vs. rainforests", "p": [{"title": "Gardeners of the Reef", "kind": "Informational", "structure": "Problem and solution", "blocks": [["p", 1, "Just off the coast of South Florida lies an underwater treasure. Florida’s Coral Reef stretches more than 350 miles, from the Dry Tortugas to the St. Lucie Inlet in Martin County. It is the only coral reef tract of its kind in the continental United States. The reef is home to lobsters, sea turtles, and hundreds of kinds of fish, and it protects the coast by breaking up powerful storm waves."], ["h", "What Is Coral?"], ["p", 2, "Coral may look like a rock or a plant, but it is actually an animal. A coral is made of many tiny animals called polyps. Each polyp builds a hard skeleton around itself. Over hundreds of years, millions of these skeletons pile up to form a reef. Even tinier helpers, a kind of algae, live inside the polyps. The algae use sunlight to make food, which they share with the coral. They also give coral its bright colors."], ["h", "A Reef in Trouble"], ["p", 3, "Over the last 40 years, Florida’s reef has been in serious trouble. When ocean water stays too warm for too long, corals become stressed and push out the algae that live inside them. Without its algae, a coral turns ghostly white. This is called <b>bleaching</b>. A bleached coral is still alive, but if the water stays hot, it can starve and die. Diseases and pollution have harmed the reef, too."], ["p", 4, "When coral dies, the whole reef suffers. Fish lose their homes and hiding places. The reef slowly crumbles, and the coast loses its natural shield against storms."], ["h", "Growing New Coral"], ["p", 5, "Scientists realized that waiting for the reef to heal on its own would take far too long. So, like gardeners, they began to grow corals in nurseries. In some underwater nurseries, small pieces of coral hang from branching frames called “coral trees.” Ocean water flows around them, bringing food, while divers keep them clean."], ["p", 6, "Scientists have also found ways to make some corals grow faster. In 2012, researchers at Mote Marine Laboratory <b>pioneered</b> a method called microfragmenting. They cut certain corals into tiny pieces. As each piece heals, it grows much faster than it would in the wild. Pieces placed side by side can even grow together into one larger coral."], ["p", 7, "When the young corals are big enough, divers carry them to the reef and attach them with a special cement. This step is called “outplanting.” Over time, the new corals grow and help rebuild the reef."], ["p", 8, "In 2019, the National Oceanic and Atmospheric Administration (NOAA) launched a huge plan called Mission: Iconic Reefs. Its goal is to restore seven important reef sites in the Florida Keys by 2040. The work is far from finished, and nurseries cannot fix warm water on their own. Still, every coral planted gives the reef a better chance to recover."]]}, {"title": "Rainforests of the Sea", "kind": "Informational", "structure": "Compare and contrast", "blocks": [["p", 1, "People often call coral reefs the “rainforests of the sea.” At first, that nickname might sound strange. One is a steamy forest on land, and the other is an underwater world. But when you look closely, these two places have a lot in common. They also have some important differences."], ["h", "Crowded with Life"], ["p", 2, "The biggest likeness is life, and lots of it. Tropical rainforests cover only a small part of Earth’s land, yet more than half of the world’s kinds of plants and animals live there. Similarly, coral reefs cover less than 1 percent of the ocean floor, but about one-fourth of all ocean animals depend on them. In both places, living things are packed tightly together."], ["h", "Built in Layers"], ["p", 3, "Both habitats are also built in layers. In a rainforest, some animals live on the dark forest floor, while monkeys and birds live high in the leafy canopy. Likewise, on a reef, eels hide in cracks near the bottom, small fish dart among the coral branches, and sharks cruise in the open water above."], ["h", "Different Builders"], ["p", 4, "However, the two habitats are built in very different ways. A rainforest is built by plants. Its giant trees use sunlight, water, and soil to grow. Unlike a rainforest, a coral reef is built by animals, the tiny coral polyps that make hard skeletons. Rainforests need plenty of rain, while reefs need clear, warm, shallow, salty water where sunlight can reach the bottom."], ["p", 5, "The two also grow at different speeds. Rainforest trees can grow tall in a few decades. Many reef-building corals, on the other hand, grow less than an inch a year. That means a large reef may have taken thousands of years to form."], ["h", "Both Worth Protecting"], ["p", 6, "Finally, both habitats give people important gifts. Rainforest plants have been used to make medicines, and the forests help clean the air. Reefs provide fish for food, attract visitors, and protect coastlines from waves. Sadly, both are in danger. Rainforests are being cut down for farms and lumber, while reefs are harmed by warming water, disease, and pollution. Whether on land or under the sea, these crowded, colorful places are worth protecting."], ["table", "Rainforests and Coral Reefs at a Glance", ["Feature", "Tropical rainforest", "Coral reef"], [["Built by", "Plants (mostly trees)", "Animals (coral polyps)"], ["Needs", "Lots of rain and sunlight", "Clear, warm, shallow, salty water and sunlight"], ["Living things", "More than half of the world’s kinds of plants and animals", "About one-fourth of all ocean animals"], ["Main dangers", "Cutting down trees", "Warming water, disease, pollution"]], null]]}], "q": [{"p": 1, "type": "mc", "skill": "Text structure", "why": "The passage explains the reef’s trouble, then the nurseries and plans that try to fix it. B is a trap: causes and effects are only part of it.", "stem": "Which statement <b>best</b> describes how “Gardeners of the Reef” is organized?", "opts": ["It describes the life of one coral polyp from start to finish.", "It explains only what causes coral to die.", "It describes a problem facing the reef and the ways scientists are trying to solve it.", "It compares coral reefs with rainforests."], "ans": [2]}, {"p": 1, "type": "mc", "skill": "Text structure", "why": "Readers must know that coral is an animal with algae inside before bleaching makes sense.", "stem": "Why does the author <b>most likely</b> include the section “What Is Coral?” before “A Reef in Trouble”?", "opts": ["to give readers background they need to understand the reef’s problem", "to prove that coral is really a plant", "to explain how divers plant new coral", "to describe the fish that live on the reef"], "ans": [0]}, {"p": 1, "type": "ab", "skill": "Cause and effect", "why": "Paragraph 3: hot water stresses corals, and they push out their algae.", "a": {"stem": "<b>Part A:</b> According to the passage, what causes coral to bleach?", "opts": ["Divers touch the coral too often.", "The coral grows too quickly in nurseries.", "Water that stays too warm makes corals push out their algae.", "Storm waves break the coral into pieces."], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“Coral may look like a rock or a plant, but it is actually an animal.” (paragraph 2)", "“When ocean water stays too warm for too long, corals become stressed and push out the algae that live inside them.” (paragraph 3)", "“Fish lose their homes and hiding places.” (paragraph 4)", "“Ocean water flows around them, bringing food, while divers keep them clean.” (paragraph 5)"], "ans": [1]}}, {"p": 1, "type": "mc", "skill": "Context clues", "why": "Mote researchers developed the method first, in 2012.", "stem": "What does the word <b>pioneered</b> mean in this sentence?", "quote": "In 2012, researchers at Mote Marine Laboratory <b>pioneered</b> a method called microfragmenting. (paragraph 6)", "opts": ["stopped using", "copied from others", "argued against", "was the first to develop"], "ans": [3]}, {"p": 1, "type": "mc", "skill": "Figurative language", "why": "Gardeners grow young plants in nurseries and plant them; scientists do the same with coral.", "stem": "In paragraph 5, the author says scientists work “like gardeners.” What does this comparison show?", "opts": ["Scientists use soil to grow coral.", "Scientists cut down old coral, the way gardeners pull weeds.", "Scientists only work on land.", "Scientists grow young corals and then plant them, the way gardeners grow and plant flowers."], "ans": [3]}, {"p": 1, "type": "match", "skill": "Text structure", "why": "Warm water and disease are problems. Nurseries, microfragmenting and outplanting are solutions.", "stem": "Decide whether each detail is part of the <b>problem</b> or part of the <b>solution</b>.", "cols": ["Problem", "Solution"], "rows": ["Water stays too warm for too long.", "Coral pieces hang from “coral trees.”", "Diseases spread through the reef.", "Corals are cut into tiny pieces to grow faster.", "Divers attach young corals to the reef."], "ans": [0, 1, 0, 1, 1]}, {"p": 1, "type": "ms", "skill": "Supporting details", "why": "“By 2040” and “far from finished” show the work will take many years.", "stem": "Which details <b>best</b> show that saving the reef will take a long time? <b>Select TWO answers.</b>", "opts": ["Its goal is to restore seven important reef sites in the Florida Keys by 2040.", "The reef is home to lobsters and sea turtles.", "The work is far from finished.", "Coral may look like a rock or a plant.", "Ocean water flows around them, bringing food."], "ans": [0, 2]}, {"p": 1, "type": "mc", "skill": "Author’s perspective", "why": "The last paragraph admits the work is unfinished but says every coral gives the reef “a better chance.”", "stem": "Which statement <b>best</b> describes the author’s point of view in paragraph 8?", "opts": ["The author believes the reef is already saved.", "The author is hopeful but knows there is still much work to do.", "The author thinks coral nurseries are a waste of time.", "The author does not care what happens to the reef."], "ans": [1]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "Signal words like similarly, likewise, however and unlike show comparing and contrasting.", "stem": "How is “Rainforests of the Sea” organized?", "opts": ["It compares and contrasts coral reefs and rainforests.", "It tells the history of rainforests in time order.", "It gives steps for planting a rainforest.", "It describes one problem and one solution."], "ans": [0]}, {"p": 2, "type": "ab", "skill": "Central idea", "why": "Both places are crowded with life, which is why reefs got the nickname.", "a": {"stem": "<b>Part A:</b> Why do people call coral reefs the “rainforests of the sea”?", "opts": ["Reefs get as much rain as rainforests.", "Reefs and rainforests are both built by trees.", "Reefs and rainforests are both crowded with many kinds of living things.", "Reefs grow in the same places as rainforests."], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“One is a steamy forest on land, and the other is an underwater world.” (paragraph 1)", "“In both places, living things are packed tightly together.” (paragraph 2)", "“Rainforest trees can grow tall in a few decades.” (paragraph 5)", "“Rainforests are being cut down for farms and lumber.” (paragraph 6)"], "ans": [1]}}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "“Unlike” signals a difference between the two habitats.", "stem": "Which sentence from the passage shows a <b>difference</b> between rainforests and reefs?", "opts": ["“Both habitats are also built in layers.”", "“Finally, both habitats give people important gifts.”", "“Similarly, coral reefs cover less than 1 percent of the ocean floor.”", "“Unlike a rainforest, a coral reef is built by animals.”"], "ans": [3]}, {"p": 2, "type": "mc", "skill": "Text features", "why": "The “Main dangers” row lists cutting trees for rainforests and warming water, disease and pollution for reefs.", "stem": "Use the table. Which danger is listed for coral reefs but <b>not</b> for rainforests?", "opts": ["cutting down trees", "lack of rain", "warming water", "too much sunlight"], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Inference", "why": "Corals grow under an inch a year, so a big reef took thousands of years to form and can’t be quickly replaced.", "stem": "Based on paragraph 5, why would it be hard to replace a large reef once it is gone?", "opts": ["Many corals grow very slowly, so a large reef takes thousands of years to form.", "Reefs only grow in rainforests.", "Coral polyps cannot build skeletons.", "Fish do not want to live on new reefs."], "ans": [0]}, {"p": 2, "type": "mc", "skill": "Central idea", "why": "The passage shows the two are alike and different and ends by saying both are worth protecting.", "stem": "Which sentence <b>best</b> states the central idea of “Rainforests of the Sea”?", "opts": ["Rainforests are more important than coral reefs.", "Monkeys and sharks live in the same ha
