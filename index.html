bitats.", "Coral reefs and rainforests are alike and different in many ways, and both are worth protecting.", "Coral reefs grow faster than rainforests."], "ans": [2]}, {"p": 0, "type": "mc", "skill": "Comparing structures", "why": "Passage 1 = problem and solution; Passage 2 = compare and contrast.", "stem": "How is the structure of Passage 1 <b>different</b> from the structure of Passage 2?", "opts": ["Passage 1 describes a problem and solutions, but Passage 2 compares two habitats.", "Passage 1 compares two habitats, but Passage 2 describes a problem and solutions.", "Both passages tell events in time order.", "Passage 1 tells a story, but Passage 2 gives steps to follow."], "ans": [0]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "Passage 1 says the algae inside corals need sunlight to make food, so the water must be clear and shallow.", "stem": "Passage 2 says reefs need water where “sunlight can reach the bottom.” Which detail from Passage 1 <b>best</b> explains why?", "opts": ["The reef protects the coast from storm waves.", "The reef stretches more than 350 miles.", "Divers attach young corals with special cement.", "The algae inside the polyps use sunlight to make food for the coral."], "ans": [3]}], "w": {"mode": "Argumentative", "intro": "Growing coral in nurseries and planting it on the reef takes many years, a lot of money, and hard work. Some people believe it is worth it. Others think the time and money should go to other problems.", "task": "Write an argumentative essay about whether scientists should keep growing coral to restore Florida’s reef. Use information from <b>both</b> passages to support your claim.", "check": ["State your claim (your opinion) clearly in the introduction.", "Give at least <b>two</b> reasons for your claim.", "Support each reason with evidence from the passages and name the passage.", "Explain how each piece of evidence supports your claim.", "Use transition words such as <i>first, in addition, for example, as a result, however,</i> and <i>in conclusion</i>.", "Write a conclusion that restates your claim.", "Check your spelling, capital letters, and punctuation."], "plan": ["Claim", "Reason 1", "Reason 2", "Reason 3 (optional)", "Other side: what someone who disagrees might say, and why they are wrong", "Conclusion"], "rub": [["Purpose / Structure", ["Clear claim kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear claim. Has an intro, body, and conclusion. Some transitions.", "Claim is unclear or drifts. Weak intro or conclusion.", "No clear claim or organization."]], ["Development", ["2–3 reasons, each with evidence from both passages that is clearly explained. Passages are named.", "Reasons are supported, but some explanation is thin. Evidence may come mostly from one passage.", "Little evidence, or evidence is copied without explaining it.", "Little or no evidence from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t5", "num": 5, "level": 3, "name": "Countdown to Liftoff", "topic": "A launch-day story and the science of rockets", "p": [{"title": "Launch Day", "kind": "Literary (story)", "structure": "Narrative (story)", "blocks": [["p", 1, "Maya had never been awake before the sun on a Saturday, but this was no ordinary Saturday. At 5:30 a.m., she stood beside Grandpa Ray in a crowd across the water from Kennedy Space Center, wrapped in his old windbreaker. Across the lagoon, the rocket stood on its launch pad like a white pencil sharpened to a point, glowing in the spotlights."], ["p", 2, "“Forty-two minutes to go,” Grandpa said, checking his watch for the third time. Then he laughed. “Listen to me. You’d think I was the one flying.”"], ["p", 3, "Maya bounced on her toes. “Were you this nervous for Apollo 11?”"], ["p", 4, "Grandpa’s eyes went soft. “July 16, 1969. I was a young engineer, just out of school. My team tested one small part, a valve no bigger than your fist. I worked on one tiny piece of a giant puzzle. Hundreds of thousands of people did. When that rocket lifted off, I forgot how to breathe.”"], ["p", 5, "Just then, a voice crackled over the loudspeaker. The countdown was on hold. Winds high above the launch site were too strong. A groan rippled through the crowd. Maya’s shoulders slumped. “What if it doesn’t go at all?”"], ["p", 6, "“Then it goes another day,” Grandpa said calmly. “Space doesn’t reward the impatient, Maya-bird. It rewards the careful. One loose bolt, one gust of wind at the wrong moment, and everything those thousands of people worked for could be lost.”"], ["p", 7, "Maya sighed and watched the clouds. She counted the boats in the lagoon. She read the mission patch on her cap until she knew every star stitched on it. Each minute seemed to crawl by like a turtle."], ["p", 8, "Almost an hour later, the loudspeaker crackled again. The winds had calmed, and the countdown would resume. The crowd erupted in cheers. Soon thousands of voices were chanting together: “Ten, nine, eight…” Maya squeezed Grandpa’s hand so hard her knuckles turned white."], ["p", 9, "At zero, a blinding light burst beneath the rocket, brighter than the sunrise behind it. The rocket rose slowly at first, then faster and faster, climbing on a pillar of fire. But strangely, there was no sound at all. Maya opened her mouth to ask why—"], ["p", 10, "Then the sound arrived. It rolled across the water like a thousand drums, so deep that Maya felt it in her chest. “Light travels faster than sound,” Grandpa shouted over the roar. “You see it before you hear it!”"], ["p", 11, "In less than a minute, the rocket was a bright star, and then it was gone. All around them, people were cheering and hugging. When Maya looked up at Grandpa, she noticed that his cheeks were wet."], ["p", 12, "On the drive home, Maya was unusually quiet. Finally she asked, “Grandpa, how many people do you think worked on that rocket?”"], ["p", 13, "“Thousands,” he said."], ["p", 14, "Maya looked out the window at the empty sky. “Then maybe someday,” she said, “one of them could be me.”"], ["p", 15, "Grandpa smiled. “I’d count on it. Just remember—”"], ["p", 16, "“I know,” Maya grinned. “Careful beats impatient.”"]]}, {"title": "What It Takes to Reach Space", "kind": "Informational", "structure": "Cause and effect", "blocks": [["p", 1, "Every time a rocket launches, it battles an invisible <b>opponent</b>: gravity. Gravity is the force that pulls everything toward the center of Earth. It is the reason a ball you toss into the air always comes back down. To break free of gravity’s grip and circle Earth, a spacecraft must travel about 17,500 miles per hour. At that speed, you could cross the entire United States in about ten minutes."], ["h", "Pushing Against Gravity"], ["p", 2, "How does a rocket reach such an amazing speed? Its engines burn fuel, which produces hot gases that blast out of the bottom of the rocket. As the rocket pushes the gases down, the gases push the rocket up. Scientists describe this with a rule of motion: for every action, there is an equal and opposite reaction. You can see the same rule at work with a balloon. If you blow one up and let it go without tying it, air rushes out one way, and the balloon zooms off the other way."], ["h", "The Fuel Problem"], ["p", 3, "Reaching orbit takes an enormous amount of fuel. In fact, most of a rocket’s weight at liftoff is fuel. But fuel is heavy, and this creates a tricky problem for engineers. The more fuel a rocket carries, the heavier it becomes, and the heavier it is, the more fuel it needs to lift off."], ["h", "Dropping Weight"], ["p", 4, "To solve this problem, engineers build rockets in sections called stages, stacked one on top of another. Each stage has its own engines and fuel. When the bottom stage uses up its fuel, it separates and falls away. As a result, the rest of the rocket is much lighter, so it can keep speeding up using less fuel. The giant Saturn V rocket that carried astronauts to the Moon had three stages."], ["p", 5, "For many years, used stages fell into the ocean and were never flown again, which made every launch extremely expensive. Today, some rocket boosters are designed to fly back and land upright so they can be used again. Reusing these boosters helps lower the cost of reaching space."], ["h", "Why Launches Get Delayed"], ["p", 6, "Because a launch involves so much power and so many parts, even a small problem can lead to big trouble. Strong winds high in the sky, lightning, and thick clouds can all be dangerous for a rocket. A single faulty part can be, too. For this reason, launch teams will hold or even scrub a launch if any condition is not just right. Waiting may be frustrating, but it is far safer than risking the crew and a rocket that took years to build."], ["table", "Launch Words to Know", ["Word", "Meaning"], [["Countdown", "The timed steps that lead up to liftoff"], ["Hold", "A pause in the countdown"], ["Scrub", "Calling off a launch attempt for that day"], ["Stage", "A section of a rocket with its own engines and fuel"], ["Orbit", "A curved path around a planet"]], null]]}], "q": [{"p": 1, "type": "mc", "skill": "Point of view", "why": "The narrator says “she,” not “I,” and we learn Maya’s thoughts and feelings (her slumped shoulders, minutes crawling by).", "stem": "From which point of view is “Launch Day” told?", "opts": ["first person, by Maya", "first person, by Grandpa Ray", "third person, mostly showing Maya’s thoughts and feelings", "third person, showing every character’s thoughts equally"], "ans": [2]}, {"p": 1, "type": "mc", "skill": "Figurative language", "why": "A rocket on the pad is tall, thin and pointed at the top, like a sharpened pencil.", "stem": "In paragraph 1, the rocket is described as standing “like a white pencil sharpened to a point.” What does this simile help the reader picture?", "opts": ["how fast the rocket will fly", "the rocket’s tall, thin, pointed shape", "how the rocket was built", "how small the rocket looks to Grandpa"], "ans": [1]}, {"p": 1, "type": "mc", "skill": "Figurative language", "why": "Turtles are slow; the hold made time feel slow because Maya was impatient.", "stem": "What does the phrase “each minute seemed to crawl by like a turtle” in paragraph 7 show?", "opts": ["Maya saw turtles in the lagoon.", "The rocket was moving slowly to the launch pad.", "Maya was enjoying every minute of the wait.", "Time felt very slow to Maya because she was waiting impatiently."], "ans": [3]}, {"p": 1, "type": "ab", "skill": "Character development", "why": "At first Maya slumps when the launch is delayed. By the end she repeats “Careful beats impatient” and dreams of building rockets.", "a": {"stem": "<b>Part A:</b> How does Maya change from the beginning of the story to the end?", "opts": ["She goes from excited to bored with rockets.", "She goes from disagreeing with Grandpa to refusing to talk to him.", "She goes from brave to frightened of loud noises.", "She goes from impatient about the delay to understanding why waiting matters and feeling inspired."], "ans": [3]}, "b": {"stem": "<b>Part B:</b> Which sentence from the story <b>best</b> supports the answer to Part A?", "opts": ["“Maya bounced on her toes.” (paragraph 3)", "“‘I know,’ Maya grinned. ‘Careful beats impatient.’” (paragraph 16)", "“She counted the boats in the lagoon.” (paragraph 7)", "“Maya’s shoulders slumped.” (paragraph 5)"], "ans": [1]}}, {"p": 1, "type": "ms", "skill": "Theme", "why": "Grandpa’s advice and the happy ending show patience; the thousands of workers show teamwork.", "stem": "Which statements are themes of “Launch Day”? <b>Select TWO answers.</b>", "opts": ["Great achievements often require patience.", "Weather is impossible to predict.", "Big accomplishments depend on the work of many people.", "Older people never understand younger people.", "It is better to give up when plans change."], "ans": [0, 2]}, {"p": 1, "type": "mc", "skill": "Plot / author’s craft", "why": "Grandpa’s memory shows the huge teamwork behind a launch and sets up Maya’s wish to be one of those workers.", "stem": "Why does the author <b>most likely</b> include Grandpa’s memory of Apollo 11 in paragraph 4?", "opts": ["to show that launches depend on many workers and to set up Maya’s dream at the end", "to show that Grandpa was famous", "to explain exactly how a valve works", "to prove that the Apollo 11 rocket was louder than today’s rockets"], "ans": [0]}, {"p": 1, "type": "mc", "skill": "Character / dialogue", "why": "Grandpa checks his watch repeatedly and jokes that he acts like the one flying, so he is excited and nervous too.", "stem": "What does Grandpa’s line “You’d think I was the one flying” in paragraph 2 reveal about him?", "opts": ["He is bored and wants to leave.", "He wishes he were an astronaut.", "He is excited and a little nervous, too.", "He thinks Maya is acting silly."], "ans": [2]}, {"p": 1, "type": "mc", "skill": "Text structure", "why": "The dash cuts Maya off, creating a moment of suspense before the sound arrives in paragraph 10.", "stem": "Paragraph 9 ends with a dash: “Maya opened her mouth to ask why—”. What is the effect of ending the paragraph this way?", "opts": ["It shows that Maya forgot her question.", "It creates suspense because something interrupts her, and the next paragraph reveals what.", "It shows that Grandpa did not want to answer.", "It signals that the story is over."], "ans": [1]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "The passage explains what causes rockets to rise, why they use stages, and why launches are delayed.", "stem": "Which statement <b>best</b> describes how “What It Takes to Reach Space” is organized?", "opts": ["It tells the story of one astronaut in time order.", "It compares rockets with airplanes.", "It gives step-by-step directions for building a rocket.", "It explains causes and effects related to launching a rocket."], "ans": [3]}, {"p": 2, "type": "ab", "skill": "Cause and effect", "why": "Dropping empty stages makes the rocket lighter, so it can keep speeding up with less fuel.", "a": {"stem": "<b>Part A:</b> Why are rockets built in stages?", "opts": ["so astronauts can ride in separate sections", "so the rocket can land in the ocean", "so the rocket gets lighter as empty stages fall away and can speed up using less fuel", "so the countdown can be paused"], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“As a result, the rest of the rocket is much lighter, so it can keep speeding up using less fuel.” (paragraph 4)", "“Each stage has its own engines and fuel.” (paragraph 4)", "“The giant Saturn V rocket that carried astronauts to the Moon had three stages.” (paragraph 4)", "“Today, some rocket boosters are designed to fly back and land upright.” (paragraph 5)"], "ans": [0]}}, {"p": 2, "type": "mc", "skill": "Context clues", "why": "The rocket “battles” gravity, so an opponent is something you struggle against.", "stem": "What does <b>opponent</b> mean in this sentence?", "quote": "Every time a rocket launches, it battles an invisible <b>opponent</b>: gravity. (paragraph 1)", "opts": ["a helper", "a type of fuel", "something you struggle against", "a part of a rocket"], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Author’s purpose", "why": "The balloon is a familiar object that shows the same action-and-reaction rule.", "stem": "Why does the author include the example of the balloon in paragraph 2?", "opts": ["to explain a hard idea using something familiar to readers", "to suggest that rockets are made from balloons", "to show that balloons can reach space", "to describe what to do on launch day"], "ans": [0]}, {"p": 2, "type": "order", "skill": "Cause and effect", "why": "Burn fuel (1) → gases blast out the bottom (2) → gases push the rocket up (3) → the rocket rises (4).", "stem": "Put these events in cause-and-effect order from <b>1</b> (first) to <b>4</b> (last).", "items": ["The gases push the rocket upward.", "The engines burn fuel.", "The rocket rises off the launch pad.", "Hot gases blast out of the bottom of the rocket."], "ans": [3, 1, 4, 2]}, {"p": 2, "type": "mc", "skill": "Inference", "why": "A booster that lands can be flown again, so a new one doesn’t have to be built each time.", "stem": "Based on paragraph 5, why does reusing boosters lower the cost of reaching space?", "opts": ["Reused boosters need no fuel.", "Reused boosters are lighter than new ones.", "Reused boosters fly faster.", "Engineers do not have to build a brand-new booster for every launch."], "ans": [3]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "In the story, the countdown stops because winds high above are too strong; paragraph 6 of Passage 2 explains that danger.", "stem": "Which sentence from Passage 2 <b>best</b> explains why the launch in “Launch Day” was put on hold?", "opts": ["“Gravity is the force that pulls everything toward the center of Earth.”", "“Strong winds high in the sky, lightning, and thick clouds can all be dangerous for a rocket.”", "“Reaching orbit takes an enormous amount of fuel.”", "“The giant Saturn V rocket… had three stages.”"], "ans": [1]}, {"p": 0, "type": "mc", "skill": "Comparing texts", "why": "The story shows what a launch feels like through characters; the article explains the science with facts.", "stem": "How is the way Passage 1 presents a rocket launch <b>different</b> from the way Passage 2 presents it?", "opts": ["Passage 1 shows what watching a launch feels like through characters, while Passage 2 explains the science with facts.", "Passage 1 explains the science of rockets, while Passage 2 tells a story about a family.", "Both passages tell a story about Apollo 11.", "Both passages give steps for building a rocket."], "ans": [0]}], "w": {"mode": "Argumentative", "intro": "Exploring space takes many years of careful work by thousands of people, and it costs a great deal of money. Some people believe space exploration is worth it. Others think the money and effort should be used to solve problems here on Earth.", "task": "Write an argumentative essay about whether exploring space is worth the effort and cost. Use information from <b>both</b> passages to support your claim.", "check": ["State your claim (your opinion) clearly in the introduction.", "Give at least <b>two</b> reasons for your claim.", "Support each reason with evidence from the passages and name the passage.", "Explain how each piece of evidence supports your claim.", "Use transition words such as <i>first, in addition, for example, as a result, however,</i> and <i>in conclusion</i>.", "Write a conclusion that restates your claim.", "Check your spelling, capital letters, and punctuation."], "plan": ["Claim", "Reason 1", "Reason 2", "Reason 3 (optional)", "Other side: what someone who disagrees might say, and why they are wrong", "Conclusion"], "rub": [["Purpose / Structure", ["Clear claim kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear claim. Has an intro, body, and conclusion. Some transitions.", "Claim is unclear or drifts. Weak intro or conclusion.", "No clear claim or organization."]], ["Development", ["2–3 reasons, each with evidence from both passages that is clearly explained. Passages are named.", "Reasons are supported, but some explanation is thin. Evidence may come mostly from one passage.", "Little evidence, or evidence is copied without explaining it.", "Little or no evidence from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t6", "num": 6, "level": 3, "name": "Weathering the Storm", "topic": "How hurricanes form and a poem about a storm night", "p": [{"title": "The Making of a Hurricane", "kind": "Informational", "structure": "Sequence with cause and effect", "blocks": [["p", 1, "Every year from June 1 to November 30, people in Florida keep a close eye on the ocean. This is Atlantic hurricane season, the time of year when powerful storms called hurricanes are most likely to form. A hurricane can stretch more than a hundred miles across and bring howling winds, pounding rain, and dangerous flooding. But how does such a giant storm begin?"], ["h", "Step 1: Warm Water"], ["p", 2, "Every hurricane begins over warm ocean water near the equator. The water at the surface must be at least 80°F. This warm water is the hurricane’s fuel. As the sun heats the ocean, some of the water evaporates, turning into an invisible gas called water vapor. The water vapor rises with the warm, moist air above the sea."], ["h", "Step 2: Clouds and Thunderstorms"], ["p", 3, "As the warm, moist air rises, it cools. The cooler air cannot hold as much water vapor, so the vapor <b>condenses</b> into tiny droplets of liquid water. Billions of these droplets form towering clouds and thunderstorms. When water vapor condenses, it also gives off heat. This heat warms the air even more, causing it to rise even faster."], ["h", "Step 3: The Storm Begins to Spin"], ["p", 4, "All that rising air leaves an area of low pressure near the ocean’s surface. Air from all around rushes in to fill the space, and then it, too, warms and rises. Because Earth is spinning, the incoming air does not travel in a straight line. Instead, it curves, and the whole cluster of thunderstorms begins to rotate. This spinning system is called a tropical depression."], ["h", "Step 4: Growing Stronger"], ["p", 5, "As long as the storm stays over warm water, it can keep growing stronger. When its winds reach 39 miles per hour, it becomes a tropical storm and is given a name. When its winds reach 74 miles per hour, it is officially a hurricane. At the center of a hurricane is the eye, a surprisingly calm area that can be 5 to 30 miles wide. The eye is surrounded by the eyewall, a ring of thunderstorms where the fiercest winds blow."], ["p", 6, "Once a hurricane moves over land, it begins to weaken because it is cut off from the warm ocean water that fuels it. Even so, it can travel far inland, knocking down trees and dumping heavy rain for days."], ["table", "How Strong Is a Hurricane?", ["Category", "Wind speed (miles per hour)"], [["1", "74–95"], ["2", "96–110"], ["3", "111–129"], ["4", "130–156"], ["5", "157 or higher"]], "Hurricanes are ranked from Category 1 to Category 5 by their wind speed."], ["h", "Getting Ready"], ["p", 7, "Because forecasters can track a hurricane for days before it arrives, families have time to prepare. Officials recommend making a family plan and finding out whether your home is in an evacuation zone. They also suggest building a supply kit with water, food that won’t spoil, flashlights, extra batteries, and medicines. Many families cover their windows with shutters. If officials tell people to evacuate, leaving quickly can save lives."]]}, {"title": "Storm Watch", "kind": "Poem", "structure": "Poem (stanzas in time order)", "blocks": [["poem", [["The radio crackles. The weatherman frowns.", "A swirl on the map creeps close to our town.", "Dad hauls out the shutters; the drill starts to whine,", "And Mom fills the bathtub right up to the line."], ["We line up the water jugs along the floor,", "Count candles and batteries, then count them once more.", "My sister and I drag the chairs from the yard", "And stack up the flowerpots, heavy and hard."], ["By evening the palm trees are bowing their heads.", "The sky turns the color of bruises and lead.", "The wind starts to whistle a wild, hungry song,", "And rain drums the roof as the night stretches long."], ["We huddle together, the four of us tight,", "Our faces aglow in the flashlight’s small light.", "Mom tells us stories; Dad hums a soft tune,", "And somewhere above us there’s no sign of moon."], ["Then, sudden and strange, the wild howling goes still.", "The eye passes over—all quiet—until", "The far side comes roaring, as fierce as before,", "And rattles the shutters and shakes the back door."], ["At dawn we step out into puddles and leaves,", "With branches like bones scattered under the eaves.", "But we are all safe, and our house standing true—", "Getting ready together is what pulled us through."]]]]}], "q": [{"p": 1, "type": "mc", "skill": "Text structure", "why": "Headings go Step 1 to Step 4, and the passage also explains why each step happens.", "stem": "Which statement <b>best</b> describes how most of “The Making of a Hurricane” is organized?", "opts": ["It compares hurricanes with tornadoes.", "It explains, step by step, how a hurricane forms and what causes each step.", "It tells the story of one family during a storm.", "It describes a problem and gives one solution."], "ans": [1]}, {"p": 1, "type": "ab", "skill": "Cause and effect", "why": "Over land the storm is cut off from the warm water that fuels it.", "a": {"stem": "<b>Part A:</b> Why does a hurricane weaken after it moves over land?", "opts": ["The land is too cold for clouds to form.", "It runs out of names.", "The trees block its winds.", "It is cut off from the warm ocean water that fuels it."], "ans": [3]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“Even so, it can travel far inland.” (paragraph 6)", "“Billions of these droplets form towering clouds and thunderstorms.” (paragraph 3)", "“The eye is surrounded by the eyewall.” (paragraph 5)", "“This warm water is the hurricane’s fuel.” (paragraph 2)"], "ans": [3]}}, {"p": 1, "type": "mc", "skill": "Context clues", "why": "The vapor (a gas) turns “into tiny droplets of liquid water.”", "stem": "What does the word <b>condenses</b> mean in paragraph 3?", "quote": "The cooler air cannot hold as much water vapor, so the vapor <b>condenses</b> into tiny droplets of liquid water. (paragraph 3)", "opts": ["heats up quickly", "changes from a gas into liquid drops", "spins in a circle", "disappears into the air"], "ans": [1]}, {"p": 1, "type": "mc", "skill": "Cause and effect", "why": "Paragraph 4: because Earth spins, the incoming air curves and the storm rotates.", "stem": "According to paragraph 4, what is one effect of Earth’s spinning?", "opts": ["The incoming air curves, so the storm begins to rotate.", "The ocean water becomes warmer.", "The storm gets a name.", "The clouds turn into rain."], "ans": [0]}, {"p": 1, "type": "mc", "skill": "Text features", "why": "120 mph falls between 111 and 129, which is Category 3.", "stem": "Use the table “How Strong Is a Hurricane?” A hurricane has winds of 120 miles per hour. What category is it?", "opts": ["Category 2", "Category 3", "Category 4", "Category 5"], "ans": [1]}, {"p": 1, "type": "order", "skill": "Sequence", "why": "Water evaporates (1) → clouds form (2) → air spins (3) → named tropical storm (4).", "stem": "Put these stages in the order they happen, from <b>1</b> (first) to <b>4</b> (last).", "items": ["The cluster of thunderstorms begins to spin.", "Warm ocean water evaporates and rises.", "Winds reach 39 miles per hour, and the storm gets a name.", "Towering clouds and thunderstorms form."], "ans": [3, 1, 4, 2]}, {"p": 1, "type": "ms", "skill": "Supporting details", "why": "Both describe the warm water that powers the storm. The other details are about later stages or safety.", "stem": "Which details <b>best</b> show that warm water is necessary for a hurricane? <b>Select TWO answers.</b>", "opts": ["“The water at the surface must be at least 80°F.”", "“Many families cover their windows with shutters.”", "“This warm water is the hurricane’s fuel.”", "“When its winds reach 39 miles per hour, it becomes a tropical storm.”", "“The eye is surrounded by the eyewall.”"], "ans": [0, 2]}, {"p": 1, "type": "mc", "skill": "Author’s purpose", "why": "The passage moves from how storms form to how people can use that warning time to stay safe.", "stem": "Why does the author <b>most likely</b> end with the section “Getting Ready”?", "opts": ["to compare different categories of hurricanes", "to explain how the eye of a hurricane forms", "to show how knowing about hurricanes helps people prepare and stay safe", "to prove that hurricanes never reach Florida"], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Poem structure", "why": "Stanzas move from getting ready, to the storm at night, to the eye, to dawn.", "stem": "How is the poem “Storm Watch” organized?", "opts": ["Each stanza describes a different kind of storm.", "The stanzas follow one family through a hurricane, from getting ready to the next morning.", "The stanzas compare two families.", "The poem gives a list of hurricane facts."], "ans": [1]}, {"p": 2, "type": "mc", "skill": "Figurative language", "why": "Personification: trees “bowing their heads” shows them bending in the strong wind.", "stem": "In line 9, the poet writes that “the palm trees are bowing their heads.” What does this personification show?", "opts": ["The palm trees are very old.", "The storm has ended.", "The family is praying.", "The palm trees are bending in the strong wind."], "ans": [3]}, {"p": 2, "type": "ab", "skill": "Theme", "why": "The last line says getting ready together “pulled us through.”", "a": {"stem": "<b>Part A:</b> What is a theme of “Storm Watch”?", "opts": ["Storms are exciting adventures.", "It is best to stay outside during a storm.", "Preparing together helps a family get through hard times.", "Weather forecasts are usually wrong."], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which line from the poem <b>best</b> supports the answer to Part A?", "opts": ["“Getting ready together is what pulled us through.” (line 24)", "“The sky turns the color of bruises and lead.” (line 10)", "“And somewhere above us there’s no sign of moon.” (line 16)", "“The radio crackles. The weatherman frowns.” (line 1)"], "ans": [0]}}, {"p": 2, "type": "mc", "skill": "Word choice / mood", "why": "Stanza 3 uses threatening imagery; stanza 4 shows the family close and calm with stories and a soft tune.", "stem": "How does the mood change from stanza 3 to stanza 4?", "opts": ["from calm to frightening", "from sad to angry", "from threatening and wild to cozy and comforting", "from cheerful to bored"], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Figurative language", "why": "“Drums” makes readers hear rain beating hard and steadily on the roof.", "stem": "Line 12 says the “rain drums the roof.” Why does the poet use the word <b>drums</b>?", "opts": ["to help the reader hear the loud, steady beating of the rain", "to show the rain is light and quiet", "to show that someone is playing music", "to show the roof is broken"], "ans": [0]}, {"p": 2, "type": "mc", "skill": "Speaker", "why": "The speaker says “My sister and I” and talks about Mom and Dad.", "stem": "Who is the speaker of the poem?", "opts": ["a weather reporter", "a neighbor watching the house", "the father", "a child in the family"], "ans": [3]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "Passage 1 explains that the eye is a calm area surrounded by the eyewall’s fierce winds, which is why the wind stops and then returns.", "stem": "In stanza 5, the howling suddenly stops and then comes back “as fierce as before.” Which detail from Passage 1 <b>best</b> explains why?", "opts": ["A hurricane can stretch more than a hundred miles across.", "The eye is a calm area surrounded by the eyewall, where the fiercest winds blow.", "Hurricane season runs from June 1 to November 30.", "Warm ocean water is the hurricane’s fuel."], "ans": [1]}, {"p": 0, "type": "ms", "skill": "Connecting texts", "why": "Passage 1 recommends shutters and supply kits with flashlights and batteries.", "stem": "Which actions in the poem follow advice given in Passage 1? <b>Select TWO answers.</b>", "opts": ["Dad hauls out the shutters.", "Mom tells stories.", "The family counts candles and batteries.", "The family watches for the moon.", "The family steps into puddles at dawn."], "ans": [0, 2]}], "w": {"mode": "Expository", "intro": "Hurricanes are among the most powerful storms on Earth, and Florida families know they must be ready for them.", "task": "Write an essay that explains how a hurricane forms and how families can stay safe when one is coming. Use information from <b>both</b> passages.", "check": ["State your central idea clearly in the introduction.", "Explain at least <b>two</b> main points.", "Support each point with facts and details from the passages and name the passage.", "Explain each detail in your own words. Don’t just copy sentences.", "Use transition words such as <i>first, next, also, because, as a result,</i> and <i>finally</i>.", "Write a conclusion that sums up your central idea.", "Check your spelling, capital letters, and punctuation."], "plan": ["Central idea (what your essay will explain)", "Main point 1", "Main point 2", "Main point 3 (optional)", "Conclusion"], "rub": [["Purpose / Structure", ["Central idea is focused and kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear central idea. Has an intro, body, and conclusion. Some transitions.", "Central idea is unclear or drifts. Weak intro or conclusion.", "No clear central idea or organization."]], ["Development", ["2–3 main points, each explained with facts from both passages. Passages are named.", "Points are supported, but some explanation is thin. Facts may come mostly from one passage.", "Few facts, or facts are copied without explaining them.", "Little or no information from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "m1", "num": 1, "level": 1, "subject": "math", "name": "Math Practice 1", "topic": "Place value, fractions, angles and line plots", "p": [], "q": [{"p": 0, "cat": "Whole numbers & algebra", "skill": "Place value", "why": "The 7 is in the ten thousands place, so it is worth 7 × 10,000 = 70,000.", "stem": "What is the value of the digit 7 in 73,410?", "type": "mc", "opts": ["7", "700", "7,000", "70,000"], "ans": [3]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Place value", "why": "Each place is worth 10 times the place to its right. 3,000 ÷ 300 = 10.", "stem": "The value of the 3 in 3,000 is how many times the value of the 3 in 300?", "type": "num", "ans": ["10"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Reading and writing numbers", "why": "48,306 = 40,000 + 8,000 + 300 + 6. There is a 0 in the tens place, so there is no tens part.", "stem": "Which shows 48,306 in expanded form?", "type": "mc", "opts": ["40,000 + 8,000 + 300 + 60", "40,000 + 8,000 + 300 + 6", "4,000 + 800 + 30 + 6", "48,000 + 30 + 6"], "ans": [1]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Reading and writing numbers", "why": "Sixty-two thousand is 62,000. Fifteen more is 62,015.", "stem": "Which number is <b>sixty-two thousand, fifteen</b>?", "type": "mc", "opts": ["62,150", "62,015", "6,215", "620,015"], "ans": [1]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Comparing numbers", "why": "45,210 > 45,120 (2 hundreds > 1 hundred) and 708,400 < 780,400 (0 ten thousands < 8 ten thousands).", "stem": "Which comparisons are true? <b>Select TWO answers.</b>", "type": "ms", "opts": ["45,210 &gt; 45,120", "9,999 &gt; 10,001", "708,400 &lt; 780,400", "32,050 = 32,500", "61,000 &lt; 16,000"], "ans": [0, 2]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Rounding", "why": "6,481 is between 6,400 and 6,500. The tens digit is 8, so round up to 6,500.", "stem": "Round 6,481 to the nearest hundred.", "type": "num", "ans": ["6500"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Multiplication", "why": "36 × 24 = (36 × 20) + (36 × 4) = 720 + 144 = 864.", "stem": "What is 36 × 24?", "type": "num", "ans": ["864"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Multiplication", "why": "312 × 3 = 900 + 30 + 6 = 936.", "stem": "What is 312 × 3?", "type": "num", "ans": ["936"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Division", "why": "852 ÷ 6: 6 × 100 = 600, 6 × 40 = 240, 6 × 2 = 12. 100 + 40 + 2 = 142.", "stem": "What is 852 ÷ 6?", "type": "num", "ans": ["142"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Word problems: remainders", "why": "75 ÷ 8 = 9 R3. Nine vans carry 72 students, so a 10th van is needed for the last 3.", "stem": "75 students are going on a field trip. Each van holds 8 students. What is the <b>fewest</b> number of vans needed?", "type": "mc", "opts": ["8", "9", "10", "11"], "ans": [2]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "True or false equations", "why": "6 × 7 = 42 and 40 + 2 = 42, so both sides are equal. The others are false: 48 ÷ 6 = 8, 5 × 8 = 40, 63 ÷ 9 = 7.", "stem": "Which equation is true?", "type": "mc", "opts": ["6 × 7 = 40 + 2", "48 ÷ 6 = 9", "5 × 8 = 45", "63 ÷ 9 = 8"], "ans": [0]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Unknown numbers", "why": "7 × 8 = 56, so the unknown is 8.", "stem": "What number makes this equation true?<br><b>7 × ☐ = 56</b>", "type": "num", "ans": ["8"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Factors", "why": "3 × 8 = 24 and 4 × 6 = 24. 2 × 14 = 28, 7 × 3 = 21, and 5 × 5 = 25.", "stem": "Which are factor pairs of 24? <b>Select TWO answers.</b>", "type": "ms", "opts": ["3 and 8", "5 and 5", "2 and 14", "4 and 6", "7 and 3"], "ans": [0, 3]}, {"p": 0, "cat": "Whole numbers & algebra", "ski 4,030 = 500,000 + 4,000 + 30. The choice 50,000 + 4,000 + 300 equals 54,300.", "stem": "Which is <b>not</b> equal to 504,030?", "type": "mc", "opts": ["500,000 + 4,000 + 30", "5 hundred thousands + 4 thousands + 3 tens", "50,000 + 4,000 + 300", "five hundred four thousand, thirty"], "ans": [2]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Rounding", "why": "The number must round to 63,800 (nearest hundred) and 64,000 (nearest thousand). 63,782 and 63,849 work. 63,851 rounds to 63,900, 63,749 to 63,700, and 64,800 is too large.", "stem": "A number rounds to 64,000 when rounded to the nearest thousand and to 63,800 when rounded to the nearest hundred. Which could be the number? <b>Select TWO answers.</b>", "type": "ms", "opts": ["63,782", "63,851", "63,849", "63,749", "64,800"], "ans": [0, 2]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Multiplication", "why": "607 × 48 = (600 × 48) + (7 × 48) = 28,800 + 336 = 29,136.", "stem": "What is 607 × 48?", "type": "num", "ans": ["29136"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Division", "why": "9 × 800 = 7,200. 7,236 − 7,200 = 36 = 9 × 4. 800 + 4 = 804.", "stem": "What is 7,236 ÷ 9?", "type": "num", "ans": ["804"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Finding mistakes", "why": "46 × 5 = 230, not 130. The correct product is 920 + 230 = 1,150.", "stem": "Kai found 46 × 25 this way:<br>46 × 20 = 920<br>46 × 5 = 130<br>920 + 130 = 1,050<br>What mistake did Kai make?", "type": "mc", "opts": ["46 × 5 should be 230.", "46 × 20 should be 9,200.", "He should have subtracted 130.", "He made no mistake."], "ans": [0]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Word problems: remainders", "why": "230 + 14 = 244 people. 244 ÷ 48 = 5 R4. Five buses carry 240, so a 6th bus is needed.", "stem": "230 students and 14 teachers are going to a museum. Each bus holds 48 people. What is the fewest number of buses needed?", "type": "num", "ans": ["6"], "unit": "buses"}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Word problems: remainders", "why": "1,250 ÷ 12 = 104 R2. 104 full cartons use 1,248 eggs, so 2 are left over.", "stem": "A farm packs 1,250 eggs into cartons of 12. How many eggs are left over after filling as many full cartons as possible?", "type": "num", "ans": ["2"], "unit": "eggs"}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "True or false equations", "why": "8 × 25 = 200 and 400 ÷ 2 = 200. The others: 9 ≠ 12, 54 ≠ 56, 120 ≠ 108.", "stem": "Which equation is true?", "type": "mc", "opts": ["8 × 25 = 400 ÷ 2", "72 ÷ 8 = 3 × 4", "6 × 9 = 50 + 6", "150 − 30 = 12 × 9"], "ans": [0]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Unknown numbers", "why": "4 × n + 15 = 63, so 4 × n = 48 and n = 12.", "stem": "What value of <i>n</i> makes the equation true?<br><b>4 × <i>n</i> + 15 = 63</b>", "type": "num", "ans": ["12"], "unit": ""}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Factors", "why": "The factors of 36 are 1, 2, 3, 4, 6, 9, 12, 18 and 36. That is 9 factors.", "stem": "Which statement about 36 is true?", "type": "mc", "opts": ["36 has exactly 9 factors.", "36 is a prime number.", "7 is a factor of 36.", "36 is a multiple of 8."], "ans": [0]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Factors and multiples", "why": "24 and 36 are both multiples of 6 and of 4. 18 and 42 are not multiples of 4. 30 is not a multiple of 4.", "stem": "Which numbers have 6 as a factor <b>and</b> are multiples of 4? <b>Select TWO answers.</b>", "type": "ms", "opts": ["18", "24", "30", "36", "42"], "ans": [1, 3]}, {"p": 0, "cat": "Whole numbers & algebra", "skill": "Patterns", "why": "2 → 2 × 3 − 1 = 5 → 14 → 41 → 41 × 3 − 1 = 122.", "stem": "A pattern starts at 2. The rule is <b>multiply by 3, then subtract 1</b>. What is the <b>5th</b> number?", "type": "num", "ans": ["122"], "unit": ""}, {"p": 0, "cat": "Fractions & decimals", "skill": "Comparing fractions", "why": "<span class=\"fr\"><span>1</span><span>2</span></span> = <span class=\"fr\"><span>4</span><span>8</span></span> and <span class=\"fr\"><span>3</span><span>4</span></span> = <span class=\"fr\"><span>6</span><span>8</span></span>. <span class=\"fr\"><span>5</span><span>8</span></span> is between them.", "stem": "Which fraction is between <span class=\"fr\"><span>1</span><span>2</span></span> and <span class=\"fr\"><span>3</span><span>4</span></span>?", "type": "mc", "opts": ["<span class=\"fr\"><span>3</span><span>8</span></span>", "<span class=\"fr\"><span>4</span><span>5</span></span>", "<span class=\"fr\"><span>7</span><span>8</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span>"], "ans": [3]}, {"p": 0, "cat": "Fractions & decimals", "skill": "Equivalent fractions", "why": "2&#8239;<span class=\"fr\"><span>3</span><span>4</span></span> = <span class=\"fr\"><span>11</span><span>4</span></span> = <span class=\"fr\"><span>22</span><span>8</span></span>.", "stem": "What number goes in the box?<br>2&#8239;<span class=\"fr\"><span>3</span><span>4</span></span> = <span class=\"fr\"><span>☐</span><span>8</span></span>", "type": "num", "ans": ["22"], "unit": ""}, {"p": 0, "cat": "Fractions & decimals", "skill": "Decomposing fractions", "why": "1&#8239;<span class=\"fr\"><span>3</span><span>8</span></span> = <span class=\"fr\"><span>11</span><span>8</span></span>. <span class=\"fr\"><span>4</span><span>8</span></span> + <span class=\"fr\"><span>6</span><span>8</span></span> = <span class=\"fr\"><span>10</span><span>8</span></span>, so it is not a way to break apart 1&#8239;<span class=\"fr\"><span>3</span><span>8</span></span>.", "stem": "Which is <b>not</b> a way to break apart 1&#8239;<span class=\"fr\"><span>3</span><span>8</span></span>?", "type": "mc", "opts": ["1 + <span class=\"fr\"><span>3</span><span>8</span></span>", "<span class=\"fr\"><span>4</span><span>8</span></span> + <span class=\"fr\"><span>6</span><span>8</span></span>", "<span class=\"fr\"><span>5</span><span>8</span></span> + <span class=\"fr\"><span>6</span><span>8</span></span>", "<span class=\"fr\"><span>8</span><span>8</span></span> + <span class=\"fr\"><span>3</span><span>8</span></span>"], "ans": [1]}, {"p": 0, "cat": "Fractions & decimals", "skill": "Subtracting mixed numbers", "why": "Rename 7&#8239;<span class=\"fr\"><span>1</span><span>6</span></span> as 6&#8239;<span class=\"fr\"><span>7</span><span>6</span></span>. 6&#8239;<span class=\"fr\"><span>7</span><span>6</span></span> − 3&#8239;<span class=\"fr\"><span>5</span><span>6</span></span> = 3&#8239;<span class=\"fr\"><span>2</span><span>6</span></span>, which equals 3&#8239;<span class=\"fr\"><span>1</span><span>3</span></span>.", "stem": "What is 7&#8239;<span class=\"fr\"><span>1</span><span>6</span></span> − 3&#8239;<span class=\"fr\"><span>5</span><span>6</span></span>?", "type": "num", "ans": ["3 2/6", "3 1/3", "20/6", "10/3"], "unit": ""}, {"p": 0, "cat": "Fractions & decimals", "skill": "Fraction word problems", "why": "3&#8239;<span class=\"fr\"><span>3</span><span>4</span></span> + 4&#8239;<span class=\"fr\"><span>2</span><span>4</span></span> = 8&#8239;<span class=\"fr\"><span>1</span><span>4</span></span> feet cut. 10 − 8&#8239;<span class=\"fr\"><span>1</span><span>4</span></span> = 1&#8239;<span class=\"fr\"><span>3</span><span>4</span></span> feet.", "stem": "A board is 10 feet long. Mr. Diaz cuts off 3&#8239;<span class=\"fr\"><span>3</span><span>4</span></span> feet, then 4&#8239;<span class=\"fr\"><span>2</span><span>4</span></span> feet. How many feet of the board are left?", "type": "num", "ans": ["1 3/4", "7/4", "1.75"], "unit": "feet"}, {"p": 0, "cat": "Fractions & decimals", "skill": "Fraction times whole number", "why": "5 × <span class=\"fr\"><span>2</span><span>3</span></span> = <span class=\"fr\"><span>10</span><span>3</span></span> = 3&#8239;<span class=\"fr\"><span>1</span><span>3</span></span>, which is between 3 and 4.", "stem": "The product 5 × <span class=\"fr\"><span>2</span><span>3</span></span> is between which two whole numbers?", "type": "mc", "opts": ["1 and 2", "2 and 3", "3 and 4", "9 and 10"], "ans": [2]}, {"p": 0, "cat": "Fractions & decimals", "skill": "Fraction times whole number", "why": "8 × <span class=\"fr\"><span>3</span><span>8</span></span> = <span class=\"fr\"><span>24</span><span>8</span></span> = 3 cups.", "stem": "A recipe uses <span class=\"fr\"><span>3</span><span>8</span></span> cup of oil for each batch. How many cups of oil are needed for 8 batches?", "type": "num", "ans": ["3", "24/8"], "unit": "cups"}, {"p": 0, "cat": "Fractions & decimals", "skill": "Comparing decimals", "why": "0.6 = 0.60, which is greater than 0.59. <span class=\"fr\"><span>6</span><span>100</span></span> = 0.06 and 0.09 are much smaller.", "stem": "Which number is the greatest?", "type": "mc", "opts": ["0.6", "0.59", "<span class=\"fr\"><span>6</span><span>100</span></span>", "0.09"], "ans": [0]}, {"p": 0, "cat": "Fractions & decimals", "skill": "Comparing decimals and fractions", "why": "Write each as hundredths: <span class=\"fr\"><span>7</span><span>100</span></span> = 0.07, 0.65, 0.7 = 0.70, <span class=\"fr\"><span>3</span><span>4</span></span> = 0.75.", "stem": "Put these numbers in order from <b>1</b> (least) to <b>4</b> (greatest).", "type": "order", "items": ["0.7", "<span class=\"fr\"><span>3</span><span>4</span></span>", "0.65", "<span class=\"fr\"><span>7</span><span>100</span></span>"], "ans": [3, 4, 2, 1]}, {"p": 0, "cat": "Fractions & decimals", "skill": "Tenths plus hundredths", "why": "<span class=\"fr\"><span>4</span><span>10</span></span> = <span class=\"fr\"><span>40</span><span>100</span></span>. <span class=\"fr\"><span>40</span><span>100</span></span> + <span class=\"fr\"><span>38</span><span>100</span></span> = <span class=\"fr\"><span>78</span><span>100</span></span> = 0.78.", "stem": "Write the sum <span class=\"fr\"><span>4</span><span>10</span></span> + <span class=\"fr\"><span>38</span><span>100</span></sp function parseNum(s){
  s=String(s==null?"":s).trim().replace(/[,$°]/g,"").replace(/[A-Za-z]+\.?$/,"").trim(); let m;
  if((m=s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/))) return +m[3]?[(+m[1])*(+m[3])+(+m[2]),+m[3]]:null;
  if((m=s.match(/^(-?\d+)\s*\/\s*(\d+)$/))) return +m[2]?[+m[1],+m[2]]:null;
  if((m=s.match(/^(-?)(\d*)\.?(\d*)$/))&&(m[2]||m[3])){ const d=m[3].length, p=10**d; return [(m[1]?-1:1)*((+(m[2]||0))*p+(+(m[3]||0))),p]; }
  return null;
}

function toggleTheme(){ const next=darkNow()?"light":"dark"; document.documentElement.dataset.theme=next; try{localStorage.setItem("g4theme",next);}catch(e){} paintThemeButtons(); }
function paintThemeButtons(){ document.querySelectorAll(".themebtn").forEach(b=>{b.textContent=themeLabel(); b.setAttribute("aria-label",darkNow()?"Switch to light background":"Switch to dark background");}); }
document.addEventListener("click",e=>{ if(e.target.closest(".themebtn")) toggleTheme(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeButtons);

/* ---------- store: online (db) when available, this device otherwise ---------- */
let S=ls.get("g4p",{students:{},prog:{}});            // local mirror
let mode="loading", isOwner=true, CFG=ls.get("g4cfg",null);
{ const m=location.hash.match(/^#connect=([^~]+)~(.+)$/); if(m){ try{CFG={url:decodeURIComponent(m[1]),code:decodeURIComponent(m[2])}; ls.set("g4cfg",CFG);}catch(e){} history.replaceState(null,"",location.pathname); } }
addEventListener("hashchange",()=>{ if(/^#connect=/.test(location.hash)) location.reload(); });
let auth=ls.get("g4auth",null), pinsOn=false;
let sid=auth&&auth.sid||null;
let T=null, st=null, cur=0, N=0, W=0, armed=false, view="home", dashSid=null;
const key=(s,t)=>s+"__"+t;
const prog=(s,t)=>{S.prog[s]=S.prog[s]||{}; return S.prog[s][t]||(S.prog[s][t]=fresh());};
const has=(s,t)=>!!(S.prog[s]&&S.prog[s][t]&&(S.prog[s][t].done||Object.keys(S.prog[s][t].ans||{}).length||S.prog[s][t].essay));
function persistLocal(){ls.set("g4p",S);}

let saveState="", savedAt=0;
function showSave(){
  const el=$("sv"); if(!el) return;
  const tm=savedAt?new Date(savedAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";
  el.textContent = mode==="online" ? (saveState==="saving"?"Saving…":saveState==="error"?"⚠ Not saved yet, retrying":savedAt?"✓ Saved to Google Sheet "+tm:"✓ Saved online")
                 : mode==="loading" ? "Connecting…" : mode==="offline" ? "⚠ Offline, saving on this device" : "Saved on this device only";
  el.className="sv "+(mode==="online"&&saveState!=="error"?"ok":"warn");
}
const pend=new Set(), busy=new Set(); let qt=null;
function save(){ if(!T||!st) return; st.updated=Date.now(); persistLocal();
  if(CFG){pend.add(key(sid,T.id)); saveState="saving"; showSave(); clearTimeout(qt); qt=setTimeout(flush,1200);} else showSave(); }
function saveFor(s,t){ prog(s,t).updated=Date.now(); persistLocal(); if(CFG){pend.add(key(s,t)); clearTimeout(qt); qt=setTimeout(flush,600);} }
async function flush(){
  clearTimeout(qt);
  for(const k of [...pend]){
    if(busy.has(k)) continue; pend.delete(k); busy.add(k);
    const [s,t]=k.split("__"), body=JSON.parse(JSON.stringify(prog(s,t)));
    body.sid=s; body.tid=t;
    try{ await api("save",{sid:s,tid:t,data:body,summary:summ(s,t,body)}); savedAt=Date.now(); if(mode!=="online"){mode="online";} if(!pend.size) saveState=""; }
    catch(e){ saveState="error"; pend.add(k);
      if(e&&e.code==="bad_code"){mode="badcode"; alertBar("The family code doesn’t match the Google Sheet. Open the setup link again.");}
      else {mode="offline"; setTimeout(flush,10000+Math.random()*5000);} }
    busy.delete(k); if(pend.has(k)) setTimeout(flush,400);
  }
  showSave();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&T&&st){ persistLocal(); if(CFG){pend.add(key(sid,T.id)); flush();} }});
function alertBar(msg){const b=$("bar"); if(!b) return; b.textContent=msg; b.hidden=false;}

async function api(action,payload){
  const r=await fetch(CFG.url,{method:"POST",body:JSON.stringify({action,code:CFG.code,...payload}),keepalive:action==="save"});
  const j=await r.json(); if(!j.ok){const e=new Error(j.error||"error"); e.code=j.error; throw e;} return j;
}
function summ(s,t,b){const T0=TESTS.find(x=>x.id===t);
  if(!T0){ const d0=DRILLS.find(x=>x.id===t); const fin=d0?d0.probs.filter((_,i)=>b.ans&&b.ans[i]&&b.ans[i].fin).length:0;
    return {student:(S.students[s]||{}).name||"", status:b.done?"Drill finished":"Drill in progress", reading:b.done?drillPts(b,d0)+" / 30 pts":"", answered:fin, total:10, writing:"", minutes:Math.round((b.t||0)/60)}; }
  return {student:(S.students[s]||{}).name||"", status:b.done?"Finished":"In progress",
  reading:b.done?scoreOf(T0,b)+" / "+T0.q.length:"", answered:Object.keys(b.ans||{}).length, total:T0.q.length, writing:T0.w&&b.done&&wtotal(b)!=="–"?wtotal(b)+" / 12":"", minutes:Math.round((b.t||0)/60)};}
async function pull(){
  const r=await fetch(CFG.url+"?code="+encodeURIComponent(CFG.code)+"&t="+Date.now()); const j=await r.json();
  if(!j.ok){const e=new Error(j.error); e.code=j.error; throw e;}
  const m={}; (j.students||[]).forEach(v=>{ if(v&&v.id&&v.name) m[v.id]={name:String(v.name).slice(0,40),created:+v.created||0,hasPin:!!v.hasPin}; }); S.students=m; pinsOn=!!j.pins;
  (j.progress||[]).forEach(v=>{ if(!v||!v.sid||!v.tid||!(TESTS.some(x=>x.id===v.tid)||DRILLS.some(x=>x.id===v.tid))) return; const k=key(v.sid,v.tid);
    if(T&&st&&k===key(sid,T.id)&&(view==="test"||view==="drill")) return;
    if(pend.has(k)||busy.has(k)) return;
    const loc=S.prog[v.sid]&&S.prog[v.sid][v.tid];
    if(loc && (loc.updated||0)>(v.updated||0)) {pend.add(k); return;}
    S.prog[v.sid]=S.prog[v.sid]||{}; S.prog[v.sid][v.tid]={...fresh(),...(v.data||{})}; });
  persistLocal();
}
async function connect(){
  if(!CFG||!CFG.url){mode="local"; rerender(); return;}
  try{ await pull(); mode="online"; }catch(e){ mode= e&&e.code==="bad_code"?"badcode":"offline"; }
  rerender(); if(pend.size) flush();
}
(async()=>{ await null; await connect();
  setInterval(async()=>{ if(!CFG) return; if(mode!=="online"){ await connect(); return; }
    if(view==="dash"||view==="home"){ try{ await pull(); rerender(); }catch(e){} } },30000);
})();

function rerender(){ paintThemeButtons(); showSave(); if(view==="home") home(); else if(view==="dash") dash(); }

/* ---------- students & log in ---------- */
function students(){ const m=S.students||{}; return Object.entries(m).sort((a,b)=>(a[1].created||0)-(b[1].created||0)); }
function ensureStudent(){ if(sid&&S.students[sid]) return sid; if(auth&&S.students[auth.sid]){sid=auth.sid; return sid;} sid=null; return null; }
function logIn(id){ auth={sid:id,at:Date.now()}; ls.set("g4auth",auth); sid=id; subj=null; ls.set("g4subj",null); closeOv(); home(); }
function logOut(){ if(T&&st) save(); if(CFG) flush(); auth=null; ls.set("g4auth",null); sid=null; subj=null; ls.set("g4subj",null); home(); }
const pinOnline=()=>mode==="online"&&CFG&&pinsOn;
async function sha(s){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return null; } }
async function rememberPin(id,pin){ const h=await sha("g4local:"+id+":"+pin); if(h){ const v=ls.get("g4pinv",{}); v[id]=h; ls.set("g4pinv",v);} }

/* PIN pad: kind = "enter" | "create" | "confirm" | "new" (add student) */
let pad={kind:"enter",id:null,pin:"",first:"",name:"",msg:""};
function padOpen(kind,id,extra={}){ pad={kind,id,pin:"",first:"",name:"",msg:"",...extra}; padDraw(); $("ov").classList.add("open"); setTimeout(()=>{const i=$("pinIn"); if(i) i.focus();},50); }
function padDraw(){
  const nm=pad.id&&S.students[pad.id]?esc(S.students[pad.id].name):esc(pad.name);
  const title={enter:`Hi ${nm}! Enter your PIN`, create:`Hi ${nm}! Make a 4-digit PIN`, confirm:"Type your new PIN again", newconfirm:"Type the PIN again", new:`Make a 4-digit PIN for ${nm}`}[pad.kind];
  const sub={enter:"", create:"You’ll use it every time you log in. Don’t share it.", confirm:"", newconfirm:"", new:"You’ll use it every time you log in."}[pad.kind];
  $("md").innerHTML=`<div class="pad"><h2>${title}</h2>${sub?`<p class="kl">${sub}</p>`:""}
   <div class="dots" aria-hidden="true">${[0,1,2,3].map(i=>`<span class="${i<pad.pin.length?"on":""}"></span>`).join("")}</div>
   <input id="pinIn" class="pinin" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="PIN" value="${pad.pin}">
   <p class="padmsg" role="alert">${pad.msg}</p>
   <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join("")}<button class="key sm" data-k="x">Cancel</button><button class="key" data-k="0">0</button><button class="key sm" data-k="b" aria-label="Delete">⌫</button></div></div>`;
  const i=$("pinIn"); i.oninput=()=>{pad.pin=i.value.replace(/\D/g,"").slice(0,4); padDraw(); $("pinIn").focus(); if(pad.pin.length===4) padDone();};
}
async function padDone(){
  const id=pad.id, pin=pad.pin;
  if(pad.kind==="create"||pad.kind==="new"){ pad.first=pin; pad.kind=pad.kind==="new"?"newconfirm":"confirm"; pad.pin=""; pad.msg=""; padDraw2(); return; }
  if(pad.kind==="confirm"||pad.kind==="newconfirm"){
    if(pin!==pad.first){ const k=pad.kind==="newconfirm"?"new":"create"; pad.kind=k; pad.pin=""; pad.first=""; pad.msg="Those didn’t match. Let’s try again."; padDraw(); return; }
    if(pad.kind==="newconfirm") return finishAdd(pad.name,pin);
    pad.msg="Saving…"; padDraw();
    try{ if(pinOnline()) await api("setPin",{id,pin}); S.students[id].hasPin=true; await rememberPin(id,pin); logIn(id); }
    catch(e){ pad.pin=""; pad.msg= e&&e.code==="has_pin"?"This student already has a PIN.":"Couldn’t save the PIN. Check the internet and try again."; padDraw(); }
    return;
  }
  // enter
  pad.msg="Checking…"; padDraw();
  if(pinOnline()){
    try{ const r=await api("login",{id,pin}); if(r.needPin){ padOpen("create",id); return; } await rememberPin(id,pin); return logIn(id); }
    catch(e){
      if(e&&e.code==="bad_pin"){ pad.pin=""; pad.msg="That PIN isn’t right. Try again."; padDraw(); return; }
      if(e&&e.code==="locked"){ pad.pin=""; pad.msg="Too many tries. Wait 10 minutes or ask a parent."; padDraw(); return; }
      // network trouble: fall through to this device's saved check
    }
  }
  const v=ls.get("g4pinv",{})[id], h=await sha("g4local:"+id+":"+pin);
  if(v&&h&&v===h) return logIn(id);
  pad.pin=""; pad.msg= v?"That PIN isn’t right. Try again.":"Can’t check your PIN without the internet right now."; padDraw();
}
const padDraw2=()=>padDraw();
$("md").addEventListener("click",e=>{ const b=e.target.closest(".key"); if(!b) return; const k=b.dataset.k;
  if(k==="x"){ closeOv(); return; } if(k==="b"){ pad.pin=pad.pin.slice(0,-1); pad.msg=""; }
  else if(pad.pin.length<4){ pad.pin+=k; }
  const again=pad.kind==="confirm"||pad.kind==="newconfirm"; again?padDraw2():padDraw(); $("pinIn").focus();
  if(pad.pin.length===4) padDone();
});
function tapName(id){
  const s=S.students[id]; if(!s) return;
  if(!pinOnline()){ const v=ls.get("g4pinv",{})[id]; if(v) return padOpen("enter",id);
    if(mode==="offline"&&s.hasPin){ alertBar("Can’t check PINs without the internet. Try again in a moment."); return; }
    return logIn(id); }   // no PINs available here: name only
  if(!s.hasPin) return padOpen("create",id);
  padOpen("enter",id);
}
function addForm(){
  $("md").innerHTML=`<form id="addF2" class="pad"><h2>Add a student</h2><label class="kl" for="addN2">First name</label>
   <input id="addN2" class="pinin" style="letter-spacing:0;text-align:left" maxlength="40" autocomplete="off">
   <div class="row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Next</button></div></form>`;
  $("ov").classList.add("open"); $("addN2").focus();
  $("addF2").onsubmit=e=>{ e.preventDefault(); const n=$("addN2").value.trim().slice(0,40); if(!n) return;
    if(pinOnline()) padOpen("new",null,{name:n}); else finishAdd(n,null); };
}
async function finishAdd(name,pin){
  const id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  S.students[id]={name,created:Date.now(),hasPin:!!pin}; persistLocal();
  if(CFG){ try{ await api("student",pin?{id,name,pin}:{id,name}); }catch(e){ alertBar("Couldn’t save the new name to the Google Sheet. It is saved on this device."); } }
  if(pin) await rememberPin(id,pin);
  logIn(id);
}

/* ---------- word problem drills ---------- */
const OPS={add:{s:"+",w:"Add",cue:"put together"},sub:{s:"−",w:"Subtract",cue:"take away or compare"},mul:{s:"×",w:"Multiply",cue:"equal groups"},div:{s:"÷",w:"Divide",cue:"share or split equally"}};
const HINT={add:"Are two amounts being put together into one total?",sub:"Is something taken away, or are you finding a difference or a missing part?",mul:"Are there equal groups (each, every, rows, times as many)?",div:"Is a total being shared or split into equal groups?"};
let D=null, dp=0, dstep="op", dmsg="", dpicked=null;
const dstate=()=>{ const s=prog(sid,D.id); s.ans=s.ans||{}; s.mix=s.mix||{}; return s; };
const pcell=i=>{ const s=dstate(); return s.ans[i]||(s.ans[i]={op:[],opTry:0,eq:null,eqTry:0,num:"",numTry:0,pts:0,fin:false}); };
function drillPts(s,d){ return Object.values(s.ans||{}).reduce((a,c)=>a+(c.pts||0),0); }
function drillDone(s,d){ return d.probs.every((_,i)=>s.ans&&s.ans[i]&&s.ans[i].fin); }
function drillCards(){
  return `<section class="drills"><div class="drhead"><h2>Word Problem Drills</h2><p class="kl">Learn to spot when to + − × ÷. Instant feedback, no timer.</p></div>
  <div class="drgrid">${DRILLS.map(d=>{ const s=S.prog[sid]&&S.prog[sid][d.id]; const fin=s?d.probs.filter((_,i)=>s.ans&&s.ans[i]&&s.ans[i].fin).length:0, pts=s?drillPts(s,d):0, done=s&&drillDone(s,d);
    const stars=done?(pts>=27?3:pts>=21?2:1):0;
    return `<button class="drcard" data-drill="${d.id}"><span class="drn">${d.num}</span><span class="drt">${d.name}</span><span class="drd">${d.desc}</span>
    <span class="drs">${done?`${"★".repeat(stars)}${"☆".repeat(3-stars)} · ${pts}/30 points`:fin?`${fin} of 10 done · continue`:"10 problems · start"}</span></button>`;}).join("")}</div></section>`;
}
function openDrill(id){
  D=DRILLS.find(d=>d.id===id); if(!D||!ensureStudent()) return;
  T=D; st=dstate(); view="drill"; dmsg=""; dpicked=null;
  dp=D.probs.findIndex((_,i)=>!pcell(i).fin); if(dp<0){ dp=0; return drillSummary(); }
  setStepFromCell(); drillDraw();
}
function setStepFromCell(){ const c=pcell(dp), p=D.probs[dp];
  dstep = c.op.length<p.ops.length ? "op" : c.eq===null ? "eq" : !c.fin ? "num" : "done"; }
function modelSVG(m){
  if(!m) return "";
  const W=440, x0=20, H=110, bar=(x,y,w,lab,fill)=>`<rect x="${x}" y="${y}" width="${Math.max(w,24)}" height="34" rx="4" style="fill:${fill};stroke:currentColor" stroke-width="1.5"/><text x="${x+Math.max(w,24)/2}" y="${y+23}" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${lab}</text>`;
  const brace=(x,w,y,lab)=>`<path d="M${x},${y+8} v-6 h${w} v6" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="${x+w/2}" y="${y-4}" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${lab}</text>`;
  const A="var(--sel)", B="color-mix(in srgb, var(--accent) 30%, transparent)", n=v=>typeof v==="number"?v.toLocaleString():v;
  const wrap=(body,h=H)=>`<svg class="fig model" viewBox="0 0 ${W+40} ${h}" width="${W+40}" role="img" aria-label="bar model">${body}</svg>`;
  if(m.k==="add"){ const t=m.a+m.b, wa=W*m.a/t; return wrap(brace(x0,W,30,"? total")+bar(x0,40,wa,n(m.a),A)+bar(x0+wa,40,W-wa,n(m.b),B)); }
  if(m.k==="sub"){ const wp=W*m.part/m.whole; return wrap(brace(x0,W,30,n(m.whole)+" whole")+bar(x0,40,wp,n(m.part),A)+bar(x0+wp,40,W-wp,"?",B)); }
  if(m.k==="cmp"){ const big=typeof m.big==="number"?m.big:null, small=typeof m.small==="number"?m.small:null, r=small&&big?small/big:.6, ws=W*r;
    return wrap(bar(x0,12,W,n(m.big),A)+bar(x0,62,ws,n(m.small),B)+`<path d="M${x0+ws},79 H${x0+W}" stroke="currentColor" stroke-dasharray="5 4" stroke-width="2"/><text x="${x0+ws+(W-ws)/2}" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${small&&big?"? difference":"6 more"}</text>`,104); }
  if(m.k==="mul"||m.k==="divg"||m.k==="divs"){
    const cnt = m.k==="divs" ? Math.min(12, m.total/m.size) : Math.min(12, m.n), w=W/cnt;
    const lab = m.k==="mul" ? n(m.size) : m.k==="divg" ? "?" : n(m.size);
    let b=brace(x0,W,30, m.k==="mul" ? `? total (${m.n} groups)` : m.k==="divg" ? `${n(m.total)} shared into ${m.n} groups` : `${n(m.total)} total · ? groups`);
    for(let i=0;i<cnt;i++) b+=bar(x0+i*w,40,w,cnt>10&&lab.length>2?"":lab,i%2?A:B);
    if((m.k==="mul"&&m.n>12)) b+=`<text x="${x0+W}" y="96" text-anchor="end" font-size="12" fill="currentColor">(showing 12 of ${m.n} groups)</text>`;
    return wrap(b);
  }
  if(m.k==="tcmp"){ const k=typeof m.n==="number"?m.n:3, w=W/Math.max(k,1);
    let b=bar(x0,12,w,n(m.small),B)+`<text x="${x0+w+10}" y="35" font-size="14" fill="currentColor">smaller amount</text>`;
    for(let i=0;i<k;i++) b+=bar(x0+i*w,62,w,i===0?n(m.small):"",i%2?A:B);
    b+=`<text x="${x0+W/2}" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${typeof m.n==="number"?`${m.n} times as much = ${m.big?n(m.big):"?"}`:`how many times? (${n(m.big)} total)`}</text>`;
    return wrap(b,126); }
  return "";
}
function storyHTML(p,lit){
  let s=esc(p.story); if(lit){ const c=esc(p.clue); s=s.replace(c,`<mark class="clue">${c}</mark>`); } return s;
}
function drillDraw(){
  view="drill"; $("app").hidden=true; $("dash").hidden=true; $("home").hidden=false; location.hash=D.id;
  const p=D.probs[dp], c=pcell(dp), two=p.ops.length>1, s=dstate();
  const dots=D.probs.map((_,i)=>{const ci=s.ans[i]; return `<button class="ddot ${i===dp?"cur":""} ${ci&&ci.fin?(ci.pts===3?"ok":"part"):""}" data-dgo="${i}" aria-label="Problem ${i+1}">${i+1}</button>`;}).join("");
  const steps=["op","eq","num"].map((k,i)=>`<span class="dstep ${dstep===k?"on":""} ${["op","eq","num"].indexOf(dstep)>i||dstep==="done"?"past":""}">${i+1}. ${["Pick the operation","Pick the number sentence","Solve it"][i]}</span>`).join("");
  const opBtns=(dis)=>`<div class="opgrid">${Object.entries(OPS).map(([k,o])=>`<button class="opbtn op-${k}" data-op="${k}" ${dis?"disabled":""}><span class="opsym">${o.s}</span><span class="opw">${o.w}</span><span class="opc">${o.cue}</span></button>`).join("")}</div>`;
  const chosen=c.op.map(k=>`<span class="opchip op-${k}">${OPS[k].s} ${OPS[k].w}</span>`).join(two?`<span class="then">then</span>`:"");
  let body="";
  if(dstep==="op"){
    body=`<h3 class="dq">${two?(c.op.length===0?"Step 1 of your plan: what do you do <b>first</b>?":"What do you do <b>next</b>?"):"Which operation solves this problem?"}</h3>${c.op.length?`<p class="kl">Your plan so far: ${chosen}</p>`:""}${opBtns(false)}`;
  } else {
    body=`<div class="dok"><span class="tick">✓</span> ${two?"Plan":"Operation"}: ${chosen}</div>${!two&&p.model?`<div class="figbox">${modelSVG(p.model)}</div>`:""}<p class="why2">${p.why}</p>`;
    if(dstep==="eq") body+=`<h3 class="dq">Which number sentence matches the story?</h3><div class="eqgrid">${p.eqs.map((e,j)=>`<button class="eqbtn" data-eq="${j}">${e}</button>`).join("")}</div>`;
    else { body+=`<div class="dok"><span class="tick">✓</span> Number sentence: <b>${p.eqs[p.eq]}</b></div>`;
      if(dstep==="num") body+=`<h3 class="dq">Now solve it. What is the answer?</h3><form id="dnf" class="row" style="align-items:center"><input id="dnum" class="numin" autocomplete="off" inputmode="numeric" placeholder="Answer"><button class="btn" type="submit">Check</button></form>`;
      else body+=`<div class="dok"><span class="tick">✓</span> Answer: <b>${p.ans.toLocaleString()}</b></div><div class="row" style="margin-top:14px">${dp<D.probs.length-1?`<button class="btn" id="dnext">Next problem ➜</button>`:`<button class="btn" id="dsum">See my results ➜</button>`}</div>`;
    }
  }
  $("home").innerHTML=`<div class="dtop"><button class="lnk back" id="dback">◀ Math</button><button class="btn ghost themebtn"></button></div>
  <div class="dwrap"><div class="dtitle"><span class="lv lv${D.level}">${LV[D.level]}</span><h1>${D.name}</h1></div>
  <div class="ddots">${dots}</div><div class="dsteps">${steps}</div>
  <article class="dcard"><div class="dlabel">Problem ${dp+1} of ${D.probs.length}</div><p class="dstory">${storyHTML(p,dstep!=="op")}</p></article>
  <div class="dbody">${body}<p class="dmsg" role="status">${dmsg}</p></div></div>`;
  paintThemeButtons();
  const f=$("dnf"); if(f){ $("dnum").focus(); f.onsubmit=e=>{e.preventDefault(); drillNum($("dnum").value);}; }
}
function drillPick(op){
  const p=D.probs[dp], c=pcell(dp), need=p.ops[c.op.length], s=dstate();
  if(op===need){ c.op.push(op); dmsg=""; if(c.op.length===p.ops.length){ if(c.opTry===0) c.pts+=1; dstep="eq"; } }
  else { c.opTry++; const k=op+">"+need; s.mix[k]=(s.mix[k]||0)+1;
    if(c.opTry>=2){ c.op=p.ops.slice(); dstep="eq"; dmsg=`The answer was <b>${p.ops.map(k=>OPS[k].w).join(" then ")}</b>. Read why below.`; }
    else dmsg=`Not quite. ${HINT[need]} Try again!`; }
  save(); drillDraw();
}
function drillEq(j){
  const p=D.probs[dp], c=pcell(dp);
  if(j===p.eq){ c.eq=j; if(c.eqTry===0) c.pts+=1; dmsg=""; dstep="num"; }
  else { c.eqTry++; if(c.eqTry>=2){ c.eq=p.eq; dstep="num"; dmsg=`The matching sentence is <b>${p.eqs[p.eq]}</b>.`; } else dmsg="That sentence doesn’t match the story. Check which numbers go together and the operation you chose."; }
  save(); drillDraw();
}
function drillNum(v){
  const p=D.probs[dp], c=pcell(dp); c.num=String(v).slice(0,12);
  if(numEq(v,String(p.ans))){ if(c.numTry===0) c.pts+=1; c.fin=true; dstep="done"; dmsg=c.pts===3?"Perfect! All three steps right the first time. ★":"Got it!"; }
  else { c.numTry++; if(c.numTry>=2){ c.fin=true; dstep="done"; dmsg=`The answer is <b>${p.ans.toLocaleString()}</b>. Check your work with the number sentence.`; } else dmsg="Not quite. Check your math and try once more."; }
  if(drillDone(dstate(),D)) dstate().done=true;
  save(); drillDraw();
}
function drillSummary(){
  const s=dstate(), pts=drillPts(s,D), stars=pts>=27?3:pts>=21?2:1;
  const mix=Object.entries(s.mix||{}).sort((a,b)=>b[1]-a[1]).slice(0,4);
  $("home").innerHTML=`<div class="dtop"><button class="lnk back" id="dback">◀ Math</button><button class="btn ghost themebtn"></button></div>
  <div class="dwrap"><div class="dtitle"><span class="lv lv${D.level}">${LV[D.level]}</span><h1>Drill complete: ${D.name}</h1></div>
  <div class="box dsum"><div class="bigstars">${"★".repeat(stars)}<span>${"☆".repeat(3-stars)}</span></div><div class="big">${pts}<small> / 30 points</small></div>
  <p class="kl">1 point for each step you got right the first time: operation, number sentence, and answer.</p>
  ${mix.length?`<h3 class="bh" style="margin-top:14px">Operations you mixed up</h3><ul class="mixl">${mix.map(([k,v])=>{const [a,b]=k.split(">"); return `<li>Chose <b>${OPS[a].s} ${OPS[a].w}</b> when it was <b>${OPS[b].s} ${OPS[b].w}</b>: ${v} time${v>1?"s":""}. <span class="kl">${HINT[b]}</span></li>`;}).join("")}</ul>`:`<p><b>No operation mix-ups. Excellent!</b></p>`}
  <div class="row" style="margin-top:16px;justify-content:center"><button class="btn" id="dagain">Practice again</button><button class="btn ghost" id="drev">Review problems</button><button class="btn ghost" id="dback2">◀ Math</button></div></div></div>`;
  paintThemeButtons();
}

function passageHTML(P,k){
  let h=`<h2 class="ptitle">${P.title}</h2><p class="psub">Passage ${k} · ${P.kind}</p>`, ln=0;
  for(const b of P.blocks){
    if(b[0]==="h") h+=`<h3>${b[1]}</h3>`;
    else if(b[0]==="p") h+=`<p><span class="pn">[${b[1]}]</span>${b[2]}</p>`;
    else if(b[0]==="box") h+=`<div class="tip"><h4>${b[1]}</h4><ul>${b[2].map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
    else if(b[0]==="poem") b[1].forEach((s,si)=>{h+=`<div class="stanza"><div class="stz">Stanza ${si+1}</div>${s.map(l=>{ln++;return `<div class="pl"><span class="lnum">${ln}</span><span>${l}</span></div>`}).join("")}</div>`;});
    else { h+=`<table><caption>${b[1]}</caption><thead><tr>${b[2].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${b[3].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`; if(b[4]) h+=`<p class="src">${b[4]}</p>`;}
  }
  return h;
}
// highlights are stored as character ranges, not page code
function hlSerialize(root){
  const out=[]; let pos=0; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){const n=w.currentNode, len=n.textContent.length, m=n.parentNode.closest&&n.parentNode.closest("mark");
    if(m){const c=+(m.className.replace("c",""))||0, last=out[out.length-1]; if(last&&last[1]===pos&&last[2]===c) last[1]+=len; else out.push([pos,pos+len,c]);}
    pos+=len;}
  return out;
}
function hlApply(root,ranges){
  if(!Array.isArray(ranges)||!ranges.length) return;
  const nodes=[]; let pos=0; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){nodes.push([w.currentNode,pos]); pos+=w.currentNode.textContent.length;}
  for(const [a,b,c] of ranges) for(const [n,p] of nodes){const s=Math.max(a,p), e=Math.min(b,p+n.textContent.length); if(s>=e) continue;
    try{const r=document.createRange(); r.setStart(n,s-p); r.setEnd(n,e-p); const m=document.createElement("mark"); m.className="c"+(+c%4); r.surroundContents(m);}catch(err){}}
}

function answered(i,s=st,t=T){
  if(i===t.q.length) return !!t.w&&s.essay.trim().length>0;
  const q=t.q[i], a=s.ans[i]; if(!a) return false;
  if(q.type==="ab") return a.a!=null&&a.b!=null;
  if(q.type==="ms") return (a.m||[]).length===2;
  if(q.type==="match"||q.type==="order") return (a.m||[]).filter(v=>v!=null).length===q.ans.length;
  if(q.type==="num") return a.m!=null&&String(a.m).trim()!=="";
  return a.m!=null;
}

$("left").addEventListener("mouseup",()=>{

  const r=s.getRangeAt(0), root=$("p"+pk); if(!root.contains(r.commonAncestorContainer)) return;
  const base=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentNode;
  const w=document.createTreeWalker(base,NodeFilter.SHOW_TEXT), nodes=[];
  while(w.nextNode()) if(r.intersectsNode(w.currentNode)) nodes.push(w.currentNode);
  for(const n of nodes){const rr=document.createRange(); rr.selectNodeContents(n);
    if(n===r.startContainer) rr.setStart(n,r.startOffset); if(n===r.endContainer) rr.setEnd(n,r.endOffset);
    if(!rr.toString().trim()) continue;

});

/* ---------- line reader: snaps to real text lines ---------- */
let lrOn=false, lines=null, li=0;
function getLines(){
  if(lines) return lines;
  const root=$("p"+pk), out=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), rg=document.createRange();
  while(w.nextNode()){const n=w.currentNode; if(!n.textContent.trim()) continue; rg.selectNodeContents(n);
    for(const r of rg.getClientRects()){ if(r.height<4||r.width<2) continue; out.push({t:r.top,b:r.bottom}); }}
  out.sort((a,b)=>a.t-b.t);
  const merged=[];
  for(const r of out){const last=merged[merged.length-1];
    if(last && r.t < last.b - Math.min(last.b-last.t,r.b-r.t)*0.5){last.t=Math.min(last.t,r.t); last.b=Math.max(last.b,r.b);} else merged.push({t:r.t,b:r.b});}
  const off=$("left").scrollTop;
  lines=merged.map(r=>({t:r.t+off,b:r.b+off})); return lines;
}
function placeReader(){
  if(!lrOn) return; const pane=$("left").getBoundingClientRect(), wrap=$("rdwrap"), tabsH=$("tabs").offsetHeight;
  wrap.style.cssText=`display:block;left:${pane.left}px;top:${pane.top+tabsH}px;width:${pane.width}px;height:${pane.height-tabsH}px`;
  const ls2=getLines(); if(!ls2.length) return; li=Math.max(0,Math.min(ls2.length-1,li));
  const off=$("left").scrollTop, l=ls2[li], top=l.t-off-(pane.top+tabsH);
  $("reader").style.top=(top-4)+"px"; $("reader").style.height=(l.b-l.t+8)+"px";
}
function setLineAt(y){const ls2=getLines(), off=$("left").scrollTop; let best=0,d=1e9;
  ls2.forEach((l,k)=>{const c=(l.t+l.b)/2-off, dd=Math.abs(c-y); if(dd<d){d=dd;best=k;}}); li=best; placeReader();}
function stepLine(dir){const ls2=getLines(); if(!ls2.length) return; li=Math.max(0,Math.min(ls2.length-1,li+dir));
  const pane=$("left"), r=pane.getBoundingClientRect(), tabsH=$("tabs").offsetHeight, top=ls2[li].t-pane.scrollTop;
  if(top < r.top+tabsH+20 || ls2[li].b-pane.scrollTop > r.bottom-20){pane.scrollTop=ls2[li].t-r.top-tabsH-(r.height-tabsH)/3;}
  placeReader();}
function stopReader(){lrOn=false; $("tLr").setAttribute("aria-pressed",false); $("rdwrap").style.display="none"; $("lrb").hidden=true;}
$("tLr").onclick=()=>{ if(lrOn) return stopReader(); lrOn=true; $("tLr").setAttribute("aria-pressed",true); $("lrb").hidden=false; lines=null;
  const ls2=getLines(), off=$("left").scrollTop, r=$("left").getBoundingClientRect(); li=Math.max(0,ls2.findIndex(l=>l.t-off>r.top+$("tabs").offsetHeight)); placeReader();};
$("lrUp").onclick=()=>stepLine(-1); $("lrDn").onclick=()=>stepLine(1);
$("left").addEventListener("mousemove",e=>{if(lrOn&&!e.buttons) setLineAt(e.clientY);});
$("left").addEventListener("scroll",()=>placeReader());

  if(lrOn && (e.key==="ArrowDown"||e.key==="ArrowUp") && !/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault(); stepLine(e.key==="ArrowDown"?1:-1);}
});
