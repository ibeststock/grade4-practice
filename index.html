bitats.", "Coral reefs and rainforests are alike and different in many ways, and both are worth protecting.", "Coral reefs grow faster than rainforests."], "ans": [2]}, {"p": 0, "type": "mc", "skill": "Comparing structures", "why": "Passage 1 = problem and solution; Passage 2 = compare and contrast.", "stem": "How is the structure of Passage 1 <b>different</b> from the structure of Passage 2?", "opts": ["Passage 1 describes a problem and solutions, but Passage 2 compares two habitats.", "Passage 1 compares two habitats, but Passage 2 describes a problem and solutions.", "Both passages tell events in time order.", "Passage 1 tells a story, but Passage 2 gives steps to follow."], "ans": [0]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "Passage 1 says the algae inside corals need sunlight to make food, so the water must be clear and shallow.", "stem": "Passage 2 says reefs need water where “sunlight can reach the bottom.” Which detail from Passage 1 <b>best</b> explains why?", "opts": ["The reef protects the coast from storm waves.", "The reef stretches more than 350 miles.", "Divers attach young corals with special cement.", "The algae inside the polyps use sunlight to make food for the coral."], "ans": [3]}], "w": {"mode": "Argumentative", "intro": "Growing coral in nurseries and planting it on the reef takes many years, a lot of money, and hard work. Some people believe it is worth it. Others think the time and money should go to other problems.", "task": "Write an argumentative essay about whether scientists should keep growing coral to restore Florida’s reef. Use information from <b>both</b> passages to support your claim.", "check": ["State your claim (your opinion) clearly in the introduction.", "Give at least <b>two</b> reasons for your claim.", "Support each reason with evidence from the passages and name the passage.", "Explain how each piece of evidence supports your claim.", "Use transition words such as <i>first, in addition, for example, as a result, however,</i> and <i>in conclusion</i>.", "Write a conclusion that restates your claim.", "Check your spelling, capital letters, and punctuation."], "plan": ["Claim", "Reason 1", "Reason 2", "Reason 3 (optional)", "Other side: what someone who disagrees might say, and why they are wrong", "Conclusion"], "rub": [["Purpose / Structure", ["Clear claim kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear claim. Has an intro, body, and conclusion. Some transitions.", "Claim is unclear or drifts. Weak intro or conclusion.", "No clear claim or organization."]], ["Development", ["2–3 reasons, each with evidence from both passages that is clearly explained. Passages are named.", "Reasons are supported, but some explanation is thin. Evidence may come mostly from one passage.", "Little evidence, or evidence is copied without explaining it.", "Little or no evidence from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t5", "num": 5, "level": 3, "name": "Countdown to Liftoff", "topic": "A launch-day story and the science of rockets", "p": [{"title": "Launch Day", "kind": "Literary (story)", "structure": "Narrative (story)", "blocks": [["p", 1, "Maya had never been awake before the sun on a Saturday, but this was no ordinary Saturday. At 5:30 a.m., she stood beside Grandpa Ray in a crowd across the water from Kennedy Space Center, wrapped in his old windbreaker. Across the lagoon, the rocket stood on its launch pad like a white pencil sharpened to a point, glowing in the spotlights."], ["p", 2, "“Forty-two minutes to go,” Grandpa said, checking his watch for the third time. Then he laughed. “Listen to me. You’d think I was the one flying.”"], ["p", 3, "Maya bounced on her toes. “Were you this nervous for Apollo 11?”"], ["p", 4, "Grandpa’s eyes went soft. “July 16, 1969. I was a young engineer, just out of school. My team tested one small part, a valve no bigger than your fist. I worked on one tiny piece of a giant puzzle. Hundreds of thousands of people did. When that rocket lifted off, I forgot how to breathe.”"], ["p", 5, "Just then, a voice crackled over the loudspeaker. The countdown was on hold. Winds high above the launch site were too strong. A groan rippled through the crowd. Maya’s shoulders slumped. “What if it doesn’t go at all?”"], ["p", 6, "“Then it goes another day,” Grandpa said calmly. “Space doesn’t reward the impatient, Maya-bird. It rewards the careful. One loose bolt, one gust of wind at the wrong moment, and everything those thousands of people worked for could be lost.”"], ["p", 7, "Maya sighed and watched the clouds. She counted the boats in the lagoon. She read the mission patch on her cap until she knew every star stitched on it. Each minute seemed to crawl by like a turtle."], ["p", 8, "Almost an hour later, the loudspeaker crackled again. The winds had calmed, and the countdown would resume. The crowd erupted in cheers. Soon thousands of voices were chanting together: “Ten, nine, eight…” Maya squeezed Grandpa’s hand so hard her knuckles turned white."], ["p", 9, "At zero, a blinding light burst beneath the rocket, brighter than the sunrise behind it. The rocket rose slowly at first, then faster and faster, climbing on a pillar of fire. But strangely, there was no sound at all. Maya opened her mouth to ask why—"], ["p", 10, "Then the sound arrived. It rolled across the water like a thousand drums, so deep that Maya felt it in her chest. “Light travels faster than sound,” Grandpa shouted over the roar. “You see it before you hear it!”"], ["p", 11, "In less than a minute, the rocket was a bright star, and then it was gone. All around them, people were cheering and hugging. When Maya looked up at Grandpa, she noticed that his cheeks were wet."], ["p", 12, "On the drive home, Maya was unusually quiet. Finally she asked, “Grandpa, how many people do you think worked on that rocket?”"], ["p", 13, "“Thousands,” he said."], ["p", 14, "Maya looked out the window at the empty sky. “Then maybe someday,” she said, “one of them could be me.”"], ["p", 15, "Grandpa smiled. “I’d count on it. Just remember—”"], ["p", 16, "“I know,” Maya grinned. “Careful beats impatient.”"]]}, {"title": "What It Takes to Reach Space", "kind": "Informational", "structure": "Cause and effect", "blocks": [["p", 1, "Every time a rocket launches, it battles an invisible <b>opponent</b>: gravity. Gravity is the force that pulls everything toward the center of Earth. It is the reason a ball you toss into the air always comes back down. To break free of gravity’s grip and circle Earth, a spacecraft must travel about 17,500 miles per hour. At that speed, you could cross the entire United States in about ten minutes."], ["h", "Pushing Against Gravity"], ["p", 2, "How does a rocket reach such an amazing speed? Its engines burn fuel, which produces hot gases that blast out of the bottom of the rocket. As the rocket pushes the gases down, the gases push the rocket up. Scientists describe this with a rule of motion: for every action, there is an equal and opposite reaction. You can see the same rule at work with a balloon. If you blow one up and let it go without tying it, air rushes out one way, and the balloon zooms off the other way."], ["h", "The Fuel Problem"], ["p", 3, "Reaching orbit takes an enormous amount of fuel. In fact, most of a rocket’s weight at liftoff is fuel. But fuel is heavy, and this creates a tricky problem for engineers. The more fuel a rocket carries, the heavier it becomes, and the heavier it is, the more fuel it needs to lift off."], ["h", "Dropping Weight"], ["p", 4, "To solve this problem, engineers build rockets in sections called stages, stacked one on top of another. Each stage has its own engines and fuel. When the bottom stage uses up its fuel, it separates and falls away. As a result, the rest of the rocket is much lighter, so it can keep speeding up using less fuel. The giant Saturn V rocket that carried astronauts to the Moon had three stages."], ["p", 5, "For many years, used stages fell into the ocean and were never flown again, which made every launch extremely expensive. Today, some rocket boosters are designed to fly back and land upright so they can be used again. Reusing these boosters helps lower the cost of reaching space."], ["h", "Why Launches Get Delayed"], ["p", 6, "Because a launch involves so much power and so many parts, even a small problem can lead to big trouble. Strong winds high in the sky, lightning, and thick clouds can all be dangerous for a rocket. A single faulty part can be, too. For this reason, launch teams will hold or even scrub a launch if any condition is not just right. Waiting may be frustrating, but it is far safer than risking the crew and a rocket that took years to build."], ["table", "Launch Words to Know", ["Word", "Meaning"], [["Countdown", "The timed steps that lead up to liftoff"], ["Hold", "A pause in the countdown"], ["Scrub", "Calling off a launch attempt for that day"], ["Stage", "A section of a rocket with its own engines and fuel"], ["Orbit", "A curved path around a planet"]], null]]}], "q": [{"p": 1, "type": "mc", "skill": "Point of view", "why": "The narrator says “she,” not “I,” and we learn Maya’s thoughts and feelings (her slumped shoulders, minutes crawling by).", "stem": "From which point of view is “Launch Day” told?", "opts": ["first person, by Maya", "first person, by Grandpa Ray", "third person, mostly showing Maya’s thoughts and feelings", "third person, showing every character’s thoughts equally"], "ans": [2]}, {"p": 1, "type": "mc", "skill": "Figurative language", "why": "A rocket on the pad is tall, thin and pointed at the top, like a sharpened pencil.", "stem": "In paragraph 1, the rocket is described as standing “like a white pencil sharpened to a point.” What does this simile help the reader picture?", "opts": ["how fast the rocket will fly", "the rocket’s tall, thin, pointed shape", "how the rocket was built", "how small the rocket looks to Grandpa"], "ans": [1]}, {"p": 1, "type": "mc", "skill": "Figurative language", "why": "Turtles are slow; the hold made time feel slow because Maya was impatient.", "stem": "What does the phrase “each minute seemed to crawl by like a turtle” in paragraph 7 show?", "opts": ["Maya saw turtles in the lagoon.", "The rocket was moving slowly to the launch pad.", "Maya was enjoying every minute of the wait.", "Time felt very slow to Maya because she was waiting impatiently."], "ans": [3]}, {"p": 1, "type": "ab", "skill": "Character development", "why": "At first Maya slumps when the launch is delayed. By the end she repeats “Careful beats impatient” and dreams of building rockets.", "a": {"stem": "<b>Part A:</b> How does Maya change from the beginning of the story to the end?", "opts": ["She goes from excited to bored with rockets.", "She goes from disagreeing with Grandpa to refusing to talk to him.", "She goes from brave to frightened of loud noises.", "She goes from impatient about the delay to understanding why waiting matters and feeling inspired."], "ans": [3]}, "b": {"stem": "<b>Part B:</b> Which sentence from the story <b>best</b> supports the answer to Part A?", "opts": ["“Maya bounced on her toes.” (paragraph 3)", "“‘I know,’ Maya grinned. ‘Careful beats impatient.’” (paragraph 16)", "“She counted the boats in the lagoon.” (paragraph 7)", "“Maya’s shoulders slumped.” (paragraph 5)"], "ans": [1]}}, {"p": 1, "type": "ms", "skill": "Theme", "why": "Grandpa’s advice and the happy ending show patience; the thousands of workers show teamwork.", "stem": "Which statements are themes of “Launch Day”? <b>Select TWO answers.</b>", "opts": ["Great achievements often require patience.", "Weather is impossible to predict.", "Big accomplishments depend on the work of many people.", "Older people never understand younger people.", "It is better to give up when plans change."], "ans": [0, 2]}, {"p": 1, "type": "mc", "skill": "Plot / author’s craft", "why": "Grandpa’s memory shows the huge teamwork behind a launch and sets up Maya’s wish to be one of those workers.", "stem": "Why does the author <b>most likely</b> include Grandpa’s memory of Apollo 11 in paragraph 4?", "opts": ["to show that launches depend on many workers and to set up Maya’s dream at the end", "to show that Grandpa was famous", "to explain exactly how a valve works", "to prove that the Apollo 11 rocket was louder than today’s rockets"], "ans": [0]}, {"p": 1, "type": "mc", "skill": "Character / dialogue", "why": "Grandpa checks his watch repeatedly and jokes that he acts like the one flying, so he is excited and nervous too.", "stem": "What does Grandpa’s line “You’d think I was the one flying” in paragraph 2 reveal about him?", "opts": ["He is bored and wants to leave.", "He wishes he were an astronaut.", "He is excited and a little nervous, too.", "He thinks Maya is acting silly."], "ans": [2]}, {"p": 1, "type": "mc", "skill": "Text structure", "why": "The dash cuts Maya off, creating a moment of suspense before the sound arrives in paragraph 10.", "stem": "Paragraph 9 ends with a dash: “Maya opened her mouth to ask why—”. What is the effect of ending the paragraph this way?", "opts": ["It shows that Maya forgot her question.", "It creates suspense because something interrupts her, and the next paragraph reveals what.", "It shows that Grandpa did not want to answer.", "It signals that the story is over."], "ans": [1]}, {"p": 2, "type": "mc", "skill": "Text structure", "why": "The passage explains what causes rockets to rise, why they use stages, and why launches are delayed.", "stem": "Which statement <b>best</b> describes how “What It Takes to Reach Space” is organized?", "opts": ["It tells the story of one astronaut in time order.", "It compares rockets with airplanes.", "It gives step-by-step directions for building a rocket.", "It explains causes and effects related to launching a rocket."], "ans": [3]}, {"p": 2, "type": "ab", "skill": "Cause and effect", "why": "Dropping empty stages makes the rocket lighter, so it can keep speeding up with less fuel.", "a": {"stem": "<b>Part A:</b> Why are rockets built in stages?", "opts": ["so astronauts can ride in separate sections", "so the rocket can land in the ocean", "so the rocket gets lighter as empty stages fall away and can speed up using less fuel", "so the countdown can be paused"], "ans": [2]}, "b": {"stem": "<b>Part B:</b> Which sentence from the passage <b>best</b> supports the answer to Part A?", "opts": ["“As a result, the rest of the rocket is much lighter, so it can keep speeding up using less fuel.” (paragraph 4)", "“Each stage has its own engines and fuel.” (paragraph 4)", "“The giant Saturn V rocket that carried astronauts to the Moon had three stages.” (paragraph 4)", "“Today, some rocket boosters are designed to fly back and land upright.” (paragraph 5)"], "ans": [0]}}, {"p": 2, "type": "mc", "skill": "Context clues", "why": "The rocket “battles” gravity, so an opponent is something you struggle against.", "stem": "What does <b>opponent</b> mean in this sentence?", "quote": "Every time a rocket launches, it battles an invisible <b>opponent</b>: gravity. (paragraph 1)", "opts": ["a helper", "a type of fuel", "something you struggle against", "a part of a rocket"], "ans": [2]}, {"p": 2, "type": "mc", "skill": "Author’s purpose", "why": "The balloon is a familiar object that shows the same action-and-reaction rule.", "stem": "Why does the author include the example of the balloon in paragraph 2?", "opts": ["to explain a hard idea using something familiar to readers", "to suggest that rockets are made from balloons", "to show that balloons can reach space", "to describe what to do on launch day"], "ans": [0]}, {"p": 2, "type": "order", "skill": "Cause and effect", "why": "Burn fuel (1) → gases blast out the bottom (2) → gases push the rocket up (3) → the rocket rises (4).", "stem": "Put these events in cause-and-effect order from <b>1</b> (first) to <b>4</b> (last).", "items": ["The gases push the rocket upward.", "The engines burn fuel.", "The rocket rises off the launch pad.", "Hot gases blast out of the bottom of the rocket."], "ans": [3, 1, 4, 2]}, {"p": 2, "type": "mc", "skill": "Inference", "why": "A booster that lands can be flown again, so a new one doesn’t have to be built each time.", "stem": "Based on paragraph 5, why does reusing boosters lower the cost of reaching space?", "opts": ["Reused boosters need no fuel.", "Reused boosters are lighter than new ones.", "Reused boosters fly faster.", "Engineers do not have to build a brand-new booster for every launch."], "ans": [3]}, {"p": 0, "type": "mc", "skill": "Connecting texts", "why": "In the story, the countdown stops because winds high above are too strong; paragraph 6 of Passage 2 explains that danger.", "stem": "Which sentence from Passage 2 <b>best</b> explains why the launch in “Launch Day” was put on hold?", "opts": ["“Gravity is the force that pulls everything toward the center of Earth.”", "“Strong winds high in the sky, lightning, and thick clouds can all be dangerous for a rocket.”", "“Reaching orbit takes an enormous amount of fuel.”", "“The giant Saturn V rocket… had three stages.”"], "ans": [1]}, {"p": 0, "type": "mc", "skill": "Comparing texts", "why": "The story shows what a launch feels like through characters; the article explains the science with facts.", "stem": "How is the way Passage 1 presents a rocket launch <b>different</b> from the way Passage 2 presents it?", "opts": ["Passage 1 shows what watching a launch feels like through characters, while Passage 2 explains the science with facts.", "Passage 1 explains the science of rockets, while Passage 2 tells a story about a family.", "Both passages tell a story about Apollo 11.", "Both passages give steps for building a rocket."], "ans": [0]}], "w": {"mode": "Argumentative", "intro": "Exploring space takes many years of careful work by thousands of people, and it costs a great deal of money. Some people believe space exploration is worth it. Others think the money and effort should be used to solve problems here on Earth.", "task": "Write an argumentative essay about whether exploring space is worth the effort and cost. Use information from <b>both</b> passages to support your claim.", "check": ["State your claim (your opinion) clearly in the introduction.", "Give at least <b>two</b> reasons for your claim.", "Support each reason with evidence from the passages and name the passage.", "Explain how each piece of evidence supports your claim.", "Use transition words such as <i>first, in addition, for example, as a result, however,</i> and <i>in conclusion</i>.", "Write a conclusion that restates your claim.", "Check your spelling, capital letters, and punctuation."], "plan": ["Claim", "Reason 1", "Reason 2", "Reason 3 (optional)", "Other side: what someone who disagrees might say, and why they are wrong", "Conclusion"], "rub": [["Purpose / Structure", ["Clear claim kept all the way through. Strong intro and conclusion. Smooth transitions.", "Clear claim. Has an intro, body, and conclusion. Some transitions.", "Claim is unclear or drifts. Weak intro or conclusion.", "No clear claim or organization."]], ["Development", ["2–3 reasons, each with evidence from both passages that is clearly explained. Passages are named.", "Reasons are supported, but some explanation is thin. Evidence may come mostly from one passage.", "Little evidence, or evidence is copied without explaining it.", "Little or no evidence from the passages."]], ["Language", ["Precise words. Varied sentences. Very few errors.", "Words are mostly clear. Some errors, but they don’t get in the way.", "Simple or repetitive words. Errors make parts hard to read.", "Many errors. Very short response."]]]}}, {"id": "t6", "num": 6, "level": 3, "name": "Weathering the Storm", "topic": "How hurricanes form and a poem about a storm night", "p": [{"title": "The Making of a Hurricane", "kind": "Informational", "structure": "Sequence with cause and effect", "blocks": [["p", 1, "Every year from June 1 to November 30, people in Florida keep a close eye on the ocean. This is Atlantic hurricane season, the time of year when powerful storms called hurricanes are most likely to form. A hurricane can stretch more than a hundred miles across and bring howling winds, pounding rain, and dangerous flooding. But how does such a giant storm begin?"], ["h", "Step 1: Warm Water"], ["p", 2, "Every hurricane begins over warm ocean water near the equator. The water at the surface must be at least 80°F. This warm water is the hurricane’s fuel. As the sun heats the ocean, some of the water evaporates, turning into an invisible gas called water vapor. The water vapor rises with the warm, moist air above the sea."], ["h", "Step 2: Clouds and Thunderstorms"], ["p", 3, "As the warm, moist air rises, it cools. The cooler air cannot hold as much water vapor, so the vapor <b>condenses</b> into tiny droplets of liquid water. Billions of these droplets form towering clouds and thunderstorms. When water vapor condenses, it also gives off heat. This heat warms the air even more, causing it to rise even faster."], ["h", "Step 3: The Storm Begins to Spin"], ["p", 4, "All that rising air leaves an area of low pressure near the ocean’s surface. Air from all around rushes in to fill the space, and then it, too, warms and rises. Because Earth is spinning, the incoming air does not travel in a straight line. Instead, it curves, and the whole cluster of thunderstorms begins to rotate. This spinning system is called a tropical depression."], ["h", "Step 4: Growing Stronger"], ["p", 5, "As long as the storm stays over warm water, it can keep growing stronger. When its winds reach 39 miles per hour, i { const m=location.hash.match(/^#connect=([^~]+)~(.+)$/); if(m){ try{CFG={url:decodeURIComponent(m[1]),code:decodeURIComponent(m[2])}; ls.set("g4cfg",CFG);}catch(e){} history.replaceState(null,"",location.pathname); } }

const pend=new Set(), busy=new Set(); let qt=null;

async function flush(){
  clearTimeout(qt);
  for(const k of [...pend]){
    if(busy.has(k)) continue; pend.delete(k); busy.add(k);
    const [s,t]=k.split("__"), body=JSON.parse(JSON.stringify(prog(s,t)));
    body.sid=s; body.tid=t;
    try{ await api("save",{sid:s,tid:t,data:body,summary:summ(s,t,body)}); savedAt=Date.now(); if(mode!=="online"){mode="online";} if(!pend.size) saveState=""; }

async function pull(){
  const r=await fetch(CFG.url+"?code="+encodeURIComponent(CFG.code)+"&t="+Date.now()); const j=await r.json();
  if(!j.ok){const e=new Error(j.error); e.code=j.error; throw e;}
  const m={}; (j.students||[]).forEach(v=>{ if(v&&v.id&&v.name) m[v.id]={name:String(v.name).slice(0,40),created:+v.created||0}; }); S.students=m;
  (j.progress||[]).forEach(v=>{ if(!v||!v.sid||!v.tid||!TESTS.some(x=>x.id===v.tid)) return; const k=key(v.sid,v.tid);
    if(T&&st&&k===key(sid,T.id)&&view==="test") return;
    if(pend.has(k)||busy.has(k)) return;
    const loc=S.prog[v.sid]&&S.prog[v.sid][v.tid];
    if(loc && (loc.updated||0)>(v.updated||0)) {pend.add(k); return;}
    S.prog[v.sid]=S.prog[v.sid]||{}; S.prog[v.sid][v.tid]={...fresh(),...(v.data||{})}; });
  persistLocal();
}

  rerender(); if(pend.size) flush();
}
(async()=>{ await null; await connect();

})();

function passageHTML(P,k){

    else if(b[0]==="poem") b[1].forEach((s,si)=>{h+=`<div class="stanza"><div class="stz">Stanza ${si+1}</div>${s.map(l=>{ln++;return `<div class="pl"><span class="lnum">${ln}</span><span>${l}</span></div>`}).join("")}</div>`;});

// highlights are stored as character ranges, not page code
function hlSerialize(root){
  const out=[]; let pos=0; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){const n=w.currentNode, len=n.textContent.length, m=n.parentNode.closest&&n.parentNode.closest("mark");
    if(m){const c=+(m.className.replace("c",""))||0, last=out[out.length-1]; if(last&&last[1]===pos&&last[2]===c) last[1]+=len; else out.push([pos,pos+len,c]);}
    pos+=len;}
  return out;
}
function hlApply(root,ranges){
  if(!Array.isArray(ranges)||!ranges.length) return;
  const nodes=[]; let pos=0; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode()){nodes.push([w.currentNode,pos]); pos+=w.currentNode.textContent.length;}
  for(const [a,b,c] of ranges) for(const [n,p] of nodes){const s=Math.max(a,p), e=Math.min(b,p+n.textContent.length); if(s>=e) continue;
    try{const r=document.createRange(); r.setStart(n,s-p); r.setEnd(n,e-p); const m=document.createElement("mark"); m.className="c"+(+c%4); r.surroundContents(m);}catch(err){}}
}

  const r=s.getRangeAt(0), root=$("p"+pk); if(!root.contains(r.commonAncestorContainer)) return;

/* ---------- line reader: snaps to real text lines ---------- */
let lrOn=false, lines=null, li=0;
function getLines(){
  if(lines) return lines;
  const root=$("p"+pk), out=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), rg=document.createRange();
  while(w.nextNode()){const n=w.currentNode; if(!n.textContent.trim()) continue; rg.selectNodeContents(n);
    for(const r of rg.getClientRects()){ if(r.height<4||r.width<2) continue; out.push({t:r.top,b:r.bottom}); }}
  out.sort((a,b)=>a.t-b.t);
  const merged=[];
  for(const r of out){const last=merged[merged.length-1];
    if(last && r.t < last.b - Math.min(last.b-last.t,r.b-r.t)*0.5){last.t=Math.min(last.t,r.t); last.b=Math.max(last.b,r.b);} else merged.push({t:r.t,b:r.b});}
  const off=$("left").scrollTop;
  lines=merged.map(r=>({t:r.t+off,b:r.b+off})); return lines;
}
function placeReader(){
  if(!lrOn) return; const pane=$("left").getBoundingClientRect(), wrap=$("rdwrap"), tabsH=$("tabs").offsetHeight;
  wrap.style.cssText=`display:block;left:${pane.left}px;top:${pane.top+tabsH}px;width:${pane.width}px;height:${pane.height-tabsH}px`;
  const ls2=getLines(); if(!ls2.length) return; li=Math.max(0,Math.min(ls2.length-1,li));
  const off=$("left").scrollTop, l=ls2[li], top=l.t-off-(pane.top+tabsH);
  $("reader").style.top=(top-4)+"px"; $("reader").style.height=(l.b-l.t+8)+"px";
}
function setLineAt(y){const ls2=getLines(), off=$("left").scrollTop; let best=0,d=1e9;
  ls2.forEach((l,k)=>{const c=(l.t+l.b)/2-off, dd=Math.abs(c-y); if(dd<d){d=dd;best=k;}}); li=best; placeReader();}
function stepLine(dir){const ls2=getLines(); if(!ls2.length) return; li=Math.max(0,Math.min(ls2.length-1,li+dir));
  const pane=$("left"), r=pane.getBoundingClientRect(), tabsH=$("tabs").offsetHeight, top=ls2[li].t-pane.scrollTop;
  if(top < r.top+tabsH+20 || ls2[li].b-pane.scrollTop > r.bottom-20){pane.scrollTop=ls2[li].t-r.top-tabsH-(r.height-tabsH)/3;}
  placeReader();}
function stopReader(){lrOn=false; $("tLr").setAttribute("aria-pressed",false); $("rdwrap").style.display="none"; $("lrb").hidden=true;}
$("tLr").onclick=()=>{ if(lrOn) return stopReader(); lrOn=true; $("tLr").setAttribute("aria-pressed",true); $("lrb").hidden=false; lines=null;
  const ls2=getLines(), off=$("left").scrollTop, r=$("left").getBoundingClientRect(); li=Math.max(0,ls2.findIndex(l=>l.t-off>r.top+$("tabs").offsetHeight)); placeReader();};
$("lrUp").onclick=()=>stepLine(-1); $("lrDn").onclick=()=>stepLine(1);
$("left").addEventListener("mousemove",e=>{if(lrOn&&!e.buttons) setLineAt(e.clientY);});
$("left").addEventListener("scroll",()=>placeReader());
addEventListener("resize",()=>{lines=null; placeReader();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeOv();
  if(lrOn && (e.key==="ArrowDown"||e.key==="ArrowUp") && !/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault(); stepLine(e.key==="ArrowDown"?1:-1);}
});
let fs=17; const zoom=d=>{fs=Math.max(14,Math.min(24,fs+d)); document.documentElement.style.setProperty("--fs",fs+"px"); lines=null; requestAnimationFrame(placeReader);};
$("tZi").onclick=()=>zoom(1); $("tZo").onclick=()=>zoom(-1);

/* ---------- timer (time is written with the next real change or when the page is hidden) ---------- */
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
setInterval(()=>{if(T&&st&&!st.done&&view==="test"&&!$("split").hidden&&document.visibilityState==="visible"){st.t=(st.t||0)+1; $("clock").textContent=fmt(st.t); if(st.t%15===0) persistLocal();}},1000);

/* ---------- review / submit ---------- */
function closeOv(){$("ov").classList.remove("open");}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov") closeOv();});
function review(){
  armed=false; const left=[...Array(N+1).keys()].filter(i=>!answered(i)).length;
  let h=`<h2>Review your answers</h2><p>Click any box to go back to it. Flagged items have an orange border.</p><div class="grid">`;
  for(let i=0;i<=N;i++) h+=`<button data-go="${i}" class="${answered(i)?"done":""} ${st.fl[i]?"fl":""}"><b>${i===W?"Writing":"Question "+(i+1)}</b><br>${answered(i)?"Answered":"Not answered"}${st.fl[i]?" · ⚑":""}</button>`;
  h+=`</div><p>${left?`<b>${left}</b> item${left>1?"s are":" is"} not finished yet.`:"Everything is answered."}</p>
  <div class="row"><button class="btn ghost" data-close>Keep working</button><button class="btn" data-submit>Submit test</button></div>`;
  $("md").innerHTML=h; $("ov").classList.add("open");
}
$("md").addEventListener("click",e=>{const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.go!=null) go(+t.dataset.go);
  else if(t.hasAttribute("data-close")) closeOv();
  else if(t.hasAttribute("data-submit")){const left=[...Array(N+1).keys()].filter(i=>!answered(i)).length;
    if(left&&!armed){armed=true;t.textContent="Submit anyway";return;} st.done=true; st.submitted=Date.now(); save(); if(mode==="online") flush(); closeOv(); results();}
});

/* ---------- scoring ---------- */
function isRight(q,a){a=a||{};
  if(q.type==="ab") return a.a===q.a.ans[0]&&a.b===q.b.ans[0];
  if(q.type==="ms") return (a.m||[]).length===2&&q.ans.every(v=>a.m.includes(v));
  if(q.type==="match"||q.type==="order") return q.ans.every((v,k)=>(a.m||[])[k]===v);
  return a.m===q.ans[0];
}
function wtotal(s){const v=[0,1,2].map(k=>+(s.rub||{})[k]||0); return v.every(Boolean)?v.reduce((a,b)=>a+b):"–";}

/* ---------- results page ---------- */
let filt="all";
function optList(o,yours){return `<ul class="ro">${o.opts.map((t,j)=>{const c=o.ans.includes(j), y=yours.includes(j);
  return `<li class="${c?"c":y?"y":""}"><span class="ltr">${L[j]}</span><span>${t}</span>${c?`<span class="k" style="color:var(--good)">✓ correct${y?" · your answer":""}</span>`:y?`<span class="k" style="color:var(--bad)">✗ your answer</span>`:""}</li>`}).join("")}</ul>`;}
function reviewQ(q,i){
  const a=st.ans[i]||{}, ok=isRight(q,a); let h=`<article class="rq ${ok?"":"wrong"}"><h3><span class="${ok?"ok":"no"}">${ok?"✓ Correct":"✗ Not correct"}</span> Question ${i+1} <span class="tag">${q.skill}</span><span style="color:var(--muted);font-size:13px">${q.p===0?"Both passages":"Passage "+q.p}</span></h3>`;
  if(q.type==="ab") h+=`<p>${q.a.stem}</p>${optList(q.a,[a.a])}<p>${q.b.stem}</p>${optList(q.b,[a.b])}`;
  else if(q.type==="match"){h+=`<p>${q.stem}</p><table class="rub"><tr><th>Item</th><th>Your answer</th><th>Correct answer</th></tr>${q.rows.map((r,k)=>{const y=(a.m||[])[k];return `<tr><td>${r}</td><td style="color:${y===q.ans[k]?"var(--good)":"var(--bad)"}">${y!=null?q.cols[y]:"—"}</td><td><b>${q.cols[q.ans[k]]}</b></td></tr>`}).join("")}</table>`;}
  else if(q.type==="order"){h+=`<p>${q.stem}</p><table class="rub"><tr><th>Event</th><th>Your number</th><th>Correct</th></tr>${q.items.map((r,k)=>{const y=(a.m||[])[k];return `<tr><td>${r}</td><td style="color:${y===q.ans[k]?"var(--good)":"var(--bad)"}">${y||"—"}</td><td><b>${q.ans[k]}</b></td></tr>`}).join("")}</table>`;}
  else{ if(q.quote) h+=`<blockquote>${q.quote}</blockquote>`; h+=`<p>${q.stem}</p>${optList(q,q.type==="ms"?(a.m||[]):[a.m])}`;}
  return h+`<div class="why"><b>Why:</b> ${q.why}</div></article>`;
}
function results(){
  showPlayer(false); view="results"; location.hash=T.id;
  const sc=scoreOf(T,st), pct=Math.round(sc/N*100), sk={};
  T.q.forEach((q,i)=>{const k=q.skill; sk[k]=sk[k]||[0,0]; sk[k][1]++; if(isRight(q,st.ans[i])) sk[k][0]++;});
  const strong = T.level===1?12:13;
  const msg = sc>=strong?"Great work! You’re ready for a harder level.":sc>=Math.round(N*0.65)?"Good effort. Review the questions you missed below.":"Keep practicing. Read each explanation carefully, then try again.";
  const missed=T.q.filter((q,i)=>!isRight(q,st.ans[i])).length;
  $("repin").innerHTML=`
  <div class="sum"><div class="box"><div style="color:var(--muted);font:600 14px Lexend,sans-serif">${esc(S.students[sid].name)} · Reading score</div>
    <div class="big">${sc}<small> / ${N}</small></div><p class="msg">${msg}</p><p style="margin:0;color:var(--muted)">${pct}% correct · time ${fmt(st.t||0)} · <span class="lv lv${T.level}">${LV[T.level]}</span></p></div>
    <div class="box"><div style="font:600 14px Lexend,sans-serif;color:var(--muted);margin-bottom:6px">Score by skill</div>
    ${Object.entries(sk).map(([k,[r,t]])=>`<div class="sk"><span>${k}</span><span class="bar2"><i style="width:${r/t*100}%"></i></span><span class="n">${r} / ${t}</span></div>`).join("")}</div></div>
  <div class="row" style="justify-content:space-between;align-items:center"><h2 style="font:600 22px Lexend,sans-serif;margin:8px 0">Answers and explanations</h2>
    <div class="filt"><button data-f="all" aria-pressed="${filt==="all"}">All ${N}</button><button data-f="missed" aria-pressed="${filt==="missed"}">Missed ${missed}</button></div></div>
  <div id="rqs">${T.q.map((q,i)=>(filt==="missed"&&isRight(q,st.ans[i]))?"":reviewQ(q,i)).join("")||`<p>No missed questions. Excellent!</p>`}</div>
  <h2 style="font:600 22px Lexend,sans-serif;margin:20px 0 8px">Writing: score it together</h2>
  <div class="box"><p style="margin-top:0"><b>${T.w.mode} prompt:</b> ${T.w.task}</p>
  <p>Read the essay together, then choose 1–4 for each area. Florida scores B.E.S.T. Writing out of 12.</p>
  <div class="scroll"><table class="rub"><thead><tr><th>Area</th><th>4</th><th>3</th><th>2</th><th>1</th><th>Score</th></tr></thead><tbody>${T.w.rub.map((r,k)=>`<tr><th>${r[0]}</th>${r[1].map(c=>`<td>${c}</td>`).join("")}<td><select data-r="${k}" aria-label="${r[0]} score"><option value="">–</option>${[4,3,2,1].map(v=>`<option ${st.rub[k]==v?"selected":""}>${v}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
  <p><b>Writing total: <span id="wt">${wtotal(st)}</span> / 12</b></p>
  <div class="essay">${st.essay.trim()?esc(st.essay):"(No essay was written.)"}</div></div>
  <div class="row" style="margin-top:18px"><button class="btn" data-home>◀ All tests</button>${isOwner&&mode==="online"?`<button class="btn ghost" data-dash>Progress dashboard</button>`:""}<button class="btn ghost" data-look>Look back at the test</button><button class="btn ghost" data-retake>Retake this test</button></div>`;
  $("rep").scrollTop=0; showSave();
}
$("repin").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.f){filt=b.dataset.f; results();}
  else if(b.hasAttribute("data-home")) home();
  else if(b.hasAttribute("data-dash")) dash();
  else if(b.hasAttribute("data-look")) go(0);
  else if(b.hasAttribute("data-retake")){ if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Click again to erase answers";return;} S.prog[sid][T.id]=fresh(); saveFor(sid,T.id); open(T.id);}
});
$("repin").addEventListener("change",e=>{const s=e.target.closest("select"); if(!s) return; st.rub[s.dataset.r]=s.value; save(); $("wt").textContent=wtotal(st);});

const h0=location.hash.slice(1);
if(h0==="dashboard") home(); else if(TESTS.some(t=>t.id===h0)&&ensureStudent()){open(h0); if(st.done) results();} else home();
}

</script>
</body>
</html>
